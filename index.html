<script>
"use strict";
const APP_VERSION = "1.11.0";
const SCHEMA_VERSION = 3;   /* 2 adds `tracker` to every row; rows without one are days.
                               3 adds habits rows, which carry `items` and no rating */
const STRIP_DAYS = 7;                /* how much of the week the Log strip shows */
const STRIP_BACK = STRIP_DAYS - 1;   /* ...expressed as days back */

/* the five colours are the one thing both trackers share outright; the words
   under each label come from the tracker (TRACKERS[...].subs) */
const RATINGS = {
  xgreen: {label:"Extra green", hex:"#3FD07A", cls:"gg", extra:true},
  green:  {label:"Green",       hex:"#56A06B", cls:"g"},
  yellow: {label:"Yellow",      hex:"#E3A63F", cls:"y"},
  red:    {label:"Red",         hex:"#C4605A", cls:"r"},
  xred:   {label:"Extra red",   hex:"#F2453D", cls:"rr", extra:true}
};
const RORDER = ["xgreen","green","yellow","red","xred"];
const isGood = r => r === "green" || r === "xgreen";

/* Two trackers share the five colours, the seven-day window, the calendar, the
   charts and the backup file. Everything that differs between them lives here. */
const TRACKERS = {
  sleep: {
    label:"Sleep", noun:"night", nounPl:"nights", every:"every night", backfill:3, change:1,
    prompt:"What drove the night",
    placeholder:"Anything worth remembering about this night",
    mix:"Night mix",
    hint:"A night belongs to the day it ended on — log this morning's sleep under today.",
    subs:{xgreen:"One of the best nights", green:"Slept well", yellow:"Mixed",
          red:"Rough night", xred:"One of the worst nights"},
    order:["health","place","alarm","duration","ted"],
    reasons:{
      health:   {label:"My health",       sub:"Body, pain, illness, energy",
                 phrase:"my health",           hex:"#4E9EA3"},
      place:    {label:"New place",       sub:"Not my own bed",
                 phrase:"being somewhere new", hex:"#5B8ED8"},
      alarm:    {label:"Alarm",           sub:"Up at a set time, however it landed",
                 phrase:"the alarm",           hex:"#DE8FA6"},
      duration: {label:"Duration",        sub:"How much of it there was",
                 phrase:"how long it was",     hex:"#7C6FD0"},
      ted:      {label:"Ted shenanigans", sub:"However the night went with Ted",
                 phrase:"Ted shenanigans",     hex:"#B57BC9"}
    }
  },
  /* Habits is a different animal: it logs events, not a verdict, so it carries
     `kinds` instead of `reasons` and `mode:"log"` tells every renderer which
     shape it is looking at. Nothing branches on the tracker's name. */
  habits: {
    label:"Habits", noun:"habit day", nounPl:"habit days", every:"every day",
    backfill:7, change:1, mode:"log",
    prompt:"What you did",
    placeholder:"Anything worth remembering about today",
    mix:"Habit mix",
    hint:"Log habits under the day they happened on. A night is compared against the day before it.",
    korder:["caffeine","exercise","sugar","meal","nap"],
    kinds:{
      caffeine:{
        label:"Caffeine", sub:"Tea", hex:"#A2764F",
        fields:[
          {key:"tea",  label:"Which",  opts:[["green","Green tea"],["black","Black tea"]]},
          {key:"oz",   label:"Size",   opts:[["8","8 oz"],["12","12 oz"],["16","16 oz"],["24","24 oz"]]},
          {key:"slot", label:"When",   opts:[["pre10","Before 10am"],["t10_12","10–12"],
                                             ["t12_15","12–3pm"],["post15","After 3pm"]], clock:"caf"}
        ]
      },
      exercise:{
        label:"Exercise", sub:"Session", hex:"#5CA86B",
        fields:[
          {key:"types",  label:"What", multi:true,
           opts:[["run","Running"],["hike","Hiking"],["strength","Strength"],["pt","PT"],["other","Other"]]},
          {key:"mins",   label:"How long", opts:[["u30","Under 30 min"],["m30_60","30–60 min"],["o60","Over 1 hr"]]},
          {key:"effort", label:"Effort",   opts:[["easy","Easy"],["medium","Medium"],["hard","Hard"]]}
        ]
      },
      sugar:{
        label:"Sugar", sub:"Something sweet", hex:"#E3A63F",
        fields:[
          {key:"bought", label:"Bought it", opts:[["yes","Yes"],["no","No"]]},
          {key:"amount", label:"How much", opts:[["low","Low"],["normal","Normal"],["high","High"]]}
        ]
      },
      meal:{
        label:"Meal", sub:"Breakfast to late snack", hex:"#5B8ED8",
        fields:[
          {key:"meal",    label:"Which", clock:"meal",
           opts:[["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],
                 ["snack","Snack"],["late","Late snack"]]},
          {key:"protein", label:"Protein in it",
           opts:[["no","No"],["low","Low"],["medium","Medium"],["high","High"]]}
        ]
      },
      nap:{
        label:"Nap", sub:"Daytime sleep", hex:"#7C6FD0",
        fields:[
          {key:"mins", label:"How long", opts:[["u30","Under 30 min"],["m30_60","30–60 min"],["o60","Over 1 hr"]]},
          {key:"slot", label:"When", opts:[["pre15","Before 3pm"],["post15","After 3pm"]], clock:"nap"}
        ]
      }
    }
  },
  days: {
    label:"Days", noun:"day", nounPl:"days", every:"every day", backfill:7, change:7,
    prompt:"What drove it",
    placeholder:"Anything worth remembering about this day",
    mix:"Day mix",
    hint:"",
    subs:{xgreen:"One of the best", green:"Good", yellow:"Mixed", red:"Rough",
          xred:"One of the worst"},
    order:["me","others","health"],
    reasons:{
      me:     {label:"Me",        sub:"Something in me — mood, choices, headspace",
               phrase:"me",        hex:"#8A79C6"},
      others: {label:"Others",    sub:"People around me",
               phrase:"others",    hex:"#5B8ED8"},
      health: {label:"My health", sub:"Body, energy, sleep, pain",
               phrase:"my health", hex:"#4E9EA3"}
    }
  }
};
let tracker = "sleep";
const T = () => TRACKERS[tracker];
/* kept as plain globals so every render below reads the current tracker's set
   without threading it through */
let REASONS = TRACKERS.sleep.reasons;
let XORDER  = TRACKERS.sleep.order;
/* the habits tracker has neither, so both fall back to empty rather than
   undefined — anything that reads them stays safe without asking which
   tracker is on screen */
let KINDS  = {};
let KORDER = [];
const knownReason = x => Object.prototype.hasOwnProperty.call(REASONS, x);
const reasonPhrase = x => !knownReason(x) ? "a reason no longer on the list"
  : (REASONS[x].phrase || REASONS[x].label.toLowerCase());
/* true for a tracker that logs events instead of rating the day */
const isLog = t => (TRACKERS[t || tracker].mode === "log");
function applyTracker(t){
  tracker = t;
  REASONS = T().reasons || {}; XORDER = T().order  || [];
  KINDS   = T().kinds   || {}; KORDER = T().korder || [];
}

/* ================= storage ================= */
const ERRORS = [];
function logErr(where, e){
  const m = "[" + new Date().toLocaleTimeString() + "] " + where + ": " + (e && e.message ? e.message : e);
  ERRORS.push(m); console.error(m);
}
let memoryOnly = false;
const LS_KEY = "days.entries.v1", LS_META = "days.meta.v1";

function lsGet(k, fb){
  try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); }
  catch(e){ logErr("read " + k, e); return fb; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ logErr("write " + k, e); memoryOnly = true; return false; }
}

let entries = [];                       /* one object per calendar day */
let meta = {lastBackup:null};
let index = new Map();                  /* date -> entry */

let idb = null;
function openIDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("dayTracker", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); };
      r.onsuccess = () => { idb = r.result; res(); };
      r.onerror = () => { logErr("idb open", r.error); res(); };
    } catch(e){ logErr("idb", e); res(); }
  });
}
function idbPut(k, v){
  if(!idb) return;
  try { idb.transaction("kv","readwrite").objectStore("kv").put(v, k); }
  catch(e){ logErr("idb put", e); }
}
function idbGet(k){
  return new Promise(res => {
    if(!idb) return res(null);
    try {
      const r = idb.transaction("kv","readonly").objectStore("kv").get(k);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    } catch(e){ logErr("idb get", e); res(null); }
  });
}

const trackerOf = e => e.tracker || "days";      /* pre-1.9 rows are day rows */
/* every live row of one tracker, newest first */
const live = tk => entries.filter(e => !e.deleted_at && trackerOf(e) === (tk || tracker));
function reindex(){
  index = new Map();
  entries.forEach(e => { if(!e.deleted_at && trackerOf(e) === tracker) index.set(e.date, e); });
}
function save(){
  entries = mergeSets(entries, []);   /* one row per date, newest wins */
  reindex();
  stale.log = stale.history = stale.charts = true;   /* whoever is on screen refreshes itself */
  lsSet(LS_KEY, entries); lsSet(LS_META, meta);
  idbPut("entries", entries); idbPut("meta", meta);
  refreshNotices();          /* the badge follows the data, not just the clock */
}
async function load(){
  await openIDB();
  const a = lsGet(LS_KEY, null);
  const b = await idbGet("entries");
  entries = mergeSets(Array.isArray(a) ? a : [], Array.isArray(b) ? b : []);
  const ma = lsGet(LS_META, null), mb = await idbGet("meta");
  meta = Object.assign({lastBackup:null, tracker:"sleep"}, mb || {}, ma || {});
  applyTracker(TRACKERS[meta.tracker] ? meta.tracker : "sleep");
  if(a === null && b === null){
    try { localStorage.setItem("days.test","1"); localStorage.removeItem("days.test"); }
    catch(e){ memoryOnly = true; logErr("storage unavailable", e); }
  }
  reindex();
}
/* merge by tracker + date, newest updated_at wins — lets two backups combine
   cleanly, and keeps a night and a day on the same date apart. Rows from a
   tracker this build does not know are carried through untouched rather than
   dropped, so an older app can never eat newer data. */
function mergeSets(x, y){
  const m = new Map();
  x.concat(y).forEach(e => {
    if(!e || !e.date) return;
    if(!e.tracker) e.tracker = "days";
    const k = e.tracker + "|" + e.date;
    const p = m.get(k);
    if(!p || (e.updated_at || "") > (p.updated_at || "")) m.set(k, e);
  });
  return Array.from(m.values())
    .sort((a,b) => b.date.localeCompare(a.date) || a.tracker.localeCompare(b.tracker));
}

/* ================= date helpers ================= */
const p2 = n => String(n).padStart(2,"0");
function keyOf(d){ return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); }
function dateOf(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
const todayKey = () => keyOf(new Date());
function shiftKey(k, n){ const d = dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function agoOf(k){ return Math.round((dateOf(todayKey()) - dateOf(k)) / 86400000); }
/* Two separate permissions, and a date can hold at most one of them.
   Entering is allowed anywhere in the backfill window while the date is still
   blank. Changing what is already down is allowed only while the date it
   describes is today — once that day is over the entry stands. Together they
   mean a backfilled date locks the moment it is saved. */
const backfillDays = () => T().backfill;
const changeDays   = () => T().change;
const within    = (k, n) => { const a = agoOf(k); return a >= 0 && a <= n - 1; };
const canEnter  = k => within(k, backfillDays()) && !index.has(k);
const canChange = k => within(k, changeDays()) && index.has(k);
const editable  = k => canEnter(k) || canChange(k);
/* The two trackers word the same lock differently because they enforce it
   differently: sleep closes at midnight, days closes at the end of the week. */
const sameDayOnly = () => changeDays() === 1;
const lockLine = () => sameDayOnly()
  ? 'A ' + T().noun + ' can only be changed on the day it belongs to — after that it stands.'
  : 'It is outside the last ' + changeDays() + ' days, so it stands.';
function fmtDay(k){
  if(k === todayKey()) return "Today";
  if(k === shiftKey(todayKey(), -1)) return "Yesterday";
  return dateOf(k).toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
}
function fmtShort(k){ return dateOf(k).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function daysSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null; }
function buzz(){ try { navigator.vibrate && navigator.vibrate(8); } catch(e){} }
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const zeroed = keys => keys.reduce((o,k) => (o[k] = 0, o), {});
/* "1 night", "6 nights" — the count and its noun, from the tracker on screen */
const nOf = n => n + " " + (n === 1 ? T().noun : T().nounPl);

/* ================= writing ================= */
function putDay(date, rating, reason, note){
  if(!editable(date)) return false;        /* never trust the button alone */
  const now = new Date().toISOString();
  /* tombstones included, so re-logging revives */
  const old = entries.find(e => e.date === date && trackerOf(e) === tracker);
  if(old){
    old.rating = rating; old.reason = reason; old.note = note || "";
    old.updated_at = now; old.deleted_at = null;
  } else {
    entries.push({tracker:tracker, date:date, rating:rating, reason:reason, note:note || "",
      created_at:now, updated_at:now, deleted_at:null, schema_version:SCHEMA_VERSION});
  }
  save();
  return true;
}
function clearDay(date){
  if(!canChange(date)) return false;       /* deleting a locked day is a change */
  const old = index.get(date);
  if(!old) return false;
  old.deleted_at = new Date().toISOString();
  old.updated_at = old.deleted_at;
  save();
  return true;
}

/* ---- habits: one row per date holding an array of instances ----
   The row shape has to stay one-per-date because mergeSets keys on
   tracker|date; a row per instance would collapse a day's five meals into one
   on every restore. So instances live in `items` and the row is the day. */
const itemsOf = k => { const e = index.get(k); return (e && Array.isArray(e.items)) ? e.items : []; };
const knownKind = x => Object.prototype.hasOwnProperty.call(KINDS, x);
/* instances of kinds this build no longer defines are kept and counted, but
   cannot be summarised — same treatment retired reasons get */
const liveItems = k => itemsOf(k).filter(it => knownKind(it.kind));
const kindsOn = k => KORDER.filter(x => liveItems(k).some(it => it.kind === x));
function newId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
/* Adding is allowed anywhere in the backfill window — unlike the rating
   trackers there is no such thing as a "blank" date, since another instance
   can always be added. Changing what is already down stays same-day only. */
const canAddItem  = k => within(k, backfillDays());
const canEditItem = k => within(k, changeDays());

function putItem(date, item){
  if(!canAddItem(date)) return false;             /* never trust the button alone */
  const now = new Date().toISOString();
  let row = entries.find(e => e.date === date && trackerOf(e) === tracker);
  if(!row){
    row = {tracker:tracker, date:date, items:[], note:"",
           created_at:now, updated_at:now, deleted_at:null, schema_version:SCHEMA_VERSION};
    entries.push(row);
  }
  if(!Array.isArray(row.items)) row.items = [];
  const at = row.items.findIndex(x => x.id === item.id);
  if(at >= 0) {
    if(!canEditItem(date)) return false;          /* editing is the tighter permission */
    row.items[at] = item;
  } else {
    row.items.push(Object.assign({id:newId(), created_at:now}, item));
  }
  row.deleted_at = null; row.updated_at = now;
  save();
  return true;
}
function removeItem(date, id){
  if(!canEditItem(date)) return false;            /* removing is a change */
  const row = index.get(date);
  if(!row || !Array.isArray(row.items)) return false;
  const at = row.items.findIndex(x => x.id === id);
  if(at < 0) return false;
  row.items.splice(at, 1);
  row.updated_at = new Date().toISOString();
  /* a day emptied of every instance is a day with nothing logged, so tombstone
     it rather than leaving a row that paints a dot for no items */
  if(!row.items.length) row.deleted_at = row.updated_at;
  save();
  return true;
}

/* ================= chrome ================= */
/* Each tab keeps its own pane in the DOM. Switching toggles visibility instead of
   tearing the view down, so nothing reflows and scroll position survives. */
let tab = "log";
const PANE = {log:      document.getElementById("pane-log"),
              history:  document.getElementById("pane-history"),
              charts:   document.getElementById("pane-charts")};
const stale     = {log:false, history:true, charts:true};
const scrollMem = {log:0, history:0, charts:0};
const SCROLLER = document.querySelector("main");
function refreshCurrent(){ RENDER[tab](); stale[tab] = false; }

function renderHeader(){
  document.getElementById("dateLine").textContent =
    new Date().toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"}).toUpperCase();
  document.querySelectorAll("#tsw button")
    .forEach(b => b.classList.toggle("on", b.dataset.t === tracker));
}
function renderBanners(){
  const b = [];
  if(memoryOnly)
    b.push('<div class="banner"><span><b>Storage is blocked.</b> Nothing you enter will survive closing the app. Open it from the Home Screen icon, not a private tab.</span></div>');
  document.getElementById("banners").innerHTML = b.join("");
  refreshNotices();
}

/* ---- notices: quiet until Sunday, then a count on the DATA button ---- */
let updateReady = false;
function lastSunday(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());        /* Sunday 00:00 of this week */
  return d;
}
function backupDue(){
  if(!entries.filter(e => !e.deleted_at).length) return false;
  if(!meta.lastBackup) return true;
  return new Date(meta.lastBackup) < lastSunday();
}
function notices(){
  const out = [];
  if(backupDue()) out.push({
    title: "Weekly backup",
    body: meta.lastBackup
      ? "Last one was " + daysSince(meta.lastBackup) + " days ago. Export this week's."
      : "You have not backed up yet. Everything is on this device only.",
    label: "Back up", fn: "exportJSON()"
  });
  if(updateReady) out.push({
    title: "New version ready",
    body: "Reload to start using it. Your entries are untouched.",
    label: "Reload", fn: "forceUpdate()"
  });
  return out;
}
function refreshNotices(){
  const n = notices().length;
  const el = document.getElementById("gearBadge");
  if(el){ el.textContent = n; el.hidden = !n; }
  try {
    if(navigator.setAppBadge){ n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); }
  } catch(e){}
}

/* ================= LOG TAB ================= */
let logDate = todayKey();
let logEditing = false;
let draft = {rating:null, reason:null, note:""};

function loadDraft(){
  const e = index.get(logDate);
  draft = e ? {rating:e.rating, reason:e.reason, note:e.note || ""} : {rating:null, reason:null, note:""};
}
function ratesHTML(sel){
  return '<div class="rates">' + RORDER.map(r =>
    '<button class="rate' + (sel === r ? " on" : "") + (RATINGS[r].extra ? " extra" : "") +
      '" data-r="' + r + '" style="--c:' + RATINGS[r].hex + '">' +
      '<span class="swatch"></span>' +
      '<span class="t"><span class="lbl">' + RATINGS[r].label + '</span>' +
      '<span class="sub">' + T().subs[r] + '</span></span></button>').join("") + '</div>';
}
function chipsHTML(sel, enabled){
  return '<div class="chips' + (enabled ? "" : " off") + '">' +
    XORDER.map(x =>
      '<button class="chip' + (sel === x ? " on" : "") + '" data-x="' + x + '"' +
        ' style="--c:' + REASONS[x].hex + '">' +
        '<span class="dot"></span><span class="t"><b>' + REASONS[x].label + '</b>' +
        '<i>' + REASONS[x].sub + '</i></span></button>').join("") + '</div>';
}

/* Naps are stored under the day they happened on, not the night they went on to
   affect, so a night reads its naps from the day before. Display only — nothing
   about the sleep entry changes, and its lock is untouched. */
function habitItemsOn(k){
  const row = entries.find(e => !e.deleted_at && trackerOf(e) === "habits" && e.date === k);
  return (row && Array.isArray(row.items)) ? row.items : [];
}
function napLine(sleepDate){
  const NAP = TRACKERS.habits.kinds.nap;
  const naps = habitItemsOn(shiftKey(sleepDate, -1)).filter(i => i.kind === "nap");
  if(!naps.length) return "";
  const opt = (f, v) => { const o = f.opts.find(p => p[0] === v); return o ? o[1] : ""; };
  const say = i => [opt(NAP.fields[0], i.mins), opt(NAP.fields[1], i.slot)].filter(Boolean).join(", ");
  return '<div class="hint">Napped the day before &middot; ' +
    esc(naps.map(say).filter(Boolean).join(" and ")) + '</div>';
}

function readoutHTML(e){
  return '<div class="readout"><div class="big" style="--c:' + RATINGS[e.rating].hex + '">' +
    '<i></i><b>' + RATINGS[e.rating].label + '</b>' +
    '<span style="color:var(--dim);font-size:14px">because of ' + reasonPhrase(e.reason) +
    '</span></div>' +
    (e.note ? '<div class="note">' + esc(e.note) + '</div>'
            : '<div class="hint">No comment on this ' + T().noun + '.</div>') +
    (tracker === "sleep" ? napLine(e.date) : "") + '</div>';
}

/* the week strip. Rating trackers paint each logged day its colour; habits have
   no single colour for a day, so they get a dot per kind logged instead. */
function stripHTML(){
  let sel = '<div class="dsel">';
  for(let i = STRIP_BACK; i >= 0; i--){
    const k = shiftKey(todayKey(), -i), e = index.get(k), d = dateOf(k);
    const lit = e && !isLog();
    sel += '<button data-d="' + k + '" class="' + (lit ? "lit" : "") + (k === logDate ? " on" : "") + '"' +
      (lit ? ' style="--c:' + RATINGS[e.rating].hex + '"' : '') + '>' +
      '<span class="wd">' + "SMTWTFS"[d.getDay()] + '</span>' +
      '<span class="dn">' + d.getDate() + '</span>' +
      (isLog() ? dotsHTML(k) : '') + '</button>';
  }
  return sel + '</div>';
}
function dotsHTML(k){
  return '<span class="hdots">' + kindsOn(k).map(x =>
    '<i style="background:' + KINDS[x].hex + '"></i>').join("") + '</span>';
}

function renderLog(){
  if(isLog()) return renderHabitLog();
  const view = PANE.log;
  const sel = stripHTML();

  const existing = index.get(logDate);
  const mayChange = canChange(logDate);

  /* Anything already saved reads back as a summary. On the day itself changing
     it takes a deliberate tap, so a stray touch cannot rewrite it; after that
     day there is no way back in at all. */
  if(existing && !(mayChange && logEditing)){
    view.innerHTML = sel +
      '<div class="picked">' + fmtDay(logDate) +
        '<span>' + (mayChange ? "LOGGED" : "LOGGED &middot; LOCKED") + '</span></div>' +
      readoutHTML(existing) +
      (mayChange
        ? '<button class="btn" id="chg">Change this ' + T().noun + '</button>'
        : '<div class="hint">Locked. ' + lockLine() + '</div>');
    view.querySelectorAll(".dsel button").forEach(b => b.onclick = () => pickLogDate(b.dataset.d));
    const chg = view.querySelector("#chg");
    if(chg) chg.onclick = () => { logEditing = true; renderLog(); };
    return;
  }

  /* Blank and out of reach: too far back to fill in now. */
  if(!existing && !canEnter(logDate)){
    view.innerHTML = sel +
      '<div class="picked">' + fmtDay(logDate) + '<span>CLOSED</span></div>' +
      '<div class="hint" style="margin-top:16px">Nothing was logged, and this ' + T().noun +
        ' is closed. You can only fill in today and the ' + (backfillDays() - 1) +
        ' ' + (backfillDays() === 2 ? T().noun : T().nounPl) + ' before it.</div>';
    view.querySelectorAll(".dsel button").forEach(b => b.onclick = () => pickLogDate(b.dataset.d));
    return;
  }

  const tiles = ratesHTML(draft.rating);
  const chips = chipsHTML(draft.reason, !!draft.rating);
  const ready = draft.rating && draft.reason;
  view.innerHTML = sel +
    '<div class="picked">' + fmtDay(logDate) +
      '<span>' + (existing ? "ALREADY LOGGED · EDITING" : "NOT LOGGED YET") + '</span></div>' +
    tiles +
    '<label style="margin-top:22px">' + T().prompt + '</label>' + chips +
    '<label for="nt">Comment (optional)</label>' +
    '<textarea id="nt" placeholder="' + T().placeholder + '">' + esc(draft.note) + '</textarea>' +
    '<button class="btn primary" id="sv"' + (ready ? "" : " disabled") + '>' +
      (existing ? "Update this " + T().noun : "Save this " + T().noun) + '</button>' +
    '<button class="btn danger" id="rm"' + (existing ? '' : ' hidden') + '>Remove this entry</button>' +
    (existing ? '<button class="btn" id="cxl">Cancel</button>' : '') +
    '<div class="hint">' + (sameDayOnly()
      ? 'You can fill in today and the ' + (backfillDays() - 1) + ' ' +
        (backfillDays() === 2 ? T().noun : T().nounPl) + ' before it. Once saved, a ' +
        T().noun + ' can only be changed on the day it belongs to — after that it stands, ' +
        'so the history stays honest.'
      : 'Tap any day in the strip above to fill in or change it. Anything older than these ' +
        changeDays() + ' days is locked, so the history stays honest.') +
      (T().hint ? '<br>' + T().hint : '') + '</div>';

  view.querySelectorAll(".dsel button").forEach(b => b.onclick = () => pickLogDate(b.dataset.d));
  /* Selection only flips classes — the comment box is never rebuilt, so the
     keyboard and caret survive tapping a colour or a reason mid-sentence. */
  view.querySelectorAll(".rate").forEach(b => b.onclick = () => {
    buzz(); draft.rating = (draft.rating === b.dataset.r) ? null : b.dataset.r; syncLog();
  });
  view.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    buzz(); draft.reason = (draft.reason === b.dataset.x) ? null : b.dataset.x; syncLog();
  });
  view.querySelector("#nt").addEventListener("input", ev => { draft.note = ev.target.value; });
  view.querySelector("#sv").onclick = () => {
    if(!draft.rating || !draft.reason) return;
    /* backfilling is a one-shot: the day it describes has already passed, so it
       is locked the instant it is written */
    if(!within(logDate, changeDays()) &&
       !confirm(fmtDay(logDate) + " is already past, so this locks as soon as you save it " +
                "and cannot be changed afterwards.\n\nSave it?")) return;
    if(!putDay(logDate, draft.rating, draft.reason, view.querySelector("#nt").value)) return;
    buzz(); renderHeader(); renderBanners();
    logEditing = false; renderLog(); stale.log = false;
    toast(fmtDay(logDate) + " saved",
      T().label + " · " + RATINGS[draft.rating].label + " · " + REASONS[draft.reason].label);
  };
  view.querySelector("#rm").onclick = () => {
    if(!confirm("Remove the entry for " + fmtDay(logDate) + "?")) return;
    clearDay(logDate); loadDraft(); renderHeader(); renderBanners();
    logEditing = false; renderLog(); stale.log = false;
    toast("Entry removed", fmtShort(logDate));
  };
  const cxl = view.querySelector("#cxl");
  if(cxl) cxl.onclick = () => { logEditing = false; loadDraft(); renderLog(); };
}

function pickLogDate(k){
  logDate = k; logEditing = false; loadDraft(); renderLog();
}

/* ================= LOG TAB — habits ================= */
/* Reading an instance back. Every field's value is a key into its own opts
   list, so one lookup covers all five kinds and nothing is hard-coded here. */
/* Values written by an older build whose options have since been reworded.
   Kept so an existing row still reads as a sentence rather than a raw key. */
const LEGACY_LABEL = {yes:"Yes"};
/* Sugar used to ask where it happened; it now asks whether you bought it.
   Buying is the closer reading of "outside", so old rows answer the new
   question rather than going blank. Read-time only — nothing is rewritten. */
function fieldValue(it, key){
  if(it[key] != null) return it[key];
  if(key === "bought" && it.where != null) return it.where === "outside" ? "yes" : "no";
  return null;
}
function optLabel(kindKey, fieldKey, val){
  const f = (KINDS[kindKey] || {fields:[]}).fields.find(x => x.key === fieldKey);
  if(!f) return String(val);
  const o = f.opts.find(p => p[0] === val);
  return o ? o[1] : (LEGACY_LABEL[val] || String(val));
}
function itemSummary(it){
  const kind = KINDS[it.kind];
  if(!kind) return "A habit no longer on the list";
  return kind.fields.map(f => {
    const v = fieldValue(it, f.key);
    if(f.multi) return (Array.isArray(v) ? v : []).map(x => optLabel(it.kind, f.key, x)).join(" + ");
    return v == null ? "" : optLabel(it.kind, f.key, v);
  }).filter(Boolean).join(" · ");
}
/* Chips are pre-selected from the clock, so logging as it happens costs no
   extra taps and logging at night costs one. The clock is only ever a guess —
   what gets stored is whatever is showing when you save. */
function clockDefault(which){
  const h = new Date().getHours();
  if(which === "caf")  return h < 10 ? "pre10" : h < 12 ? "t10_12" : h < 15 ? "t12_15" : "post15";
  if(which === "nap")  return h < 15 ? "pre15" : "post15";
  if(which === "meal") return h < 11 ? "breakfast" : h < 15 ? "lunch" : h < 21 ? "dinner" : "late";
  return null;
}

function renderHabitLog(){
  const view = PANE.log;
  const mayAdd = canAddItem(logDate), mayEdit = canEditItem(logDate);
  const items = liveItems(logDate);
  const total = itemsOf(logDate).length;
  const count = x => items.filter(it => it.kind === x).length;

  const status = mayEdit ? (total ? total + " LOGGED" : "NOTHING LOGGED YET")
               : mayAdd  ? (total ? total + " LOGGED · STILL OPEN" : "NOT LOGGED · STILL OPEN")
               :           (total ? total + " LOGGED · LOCKED" : "CLOSED");

  const tiles = '<div class="tiles">' + KORDER.map((x, i) => {
    const K = KINDS[x], n = count(x);
    const wide = (i === KORDER.length - 1 && KORDER.length % 2 === 1) ? " wide" : "";
    return '<button class="tile' + wide + '" data-k="' + x + '" style="--c:' + K.hex + '">' +
      '<span class="sw"></span>' +
      '<span class="t"><span class="lbl">' + K.label + '</span>' +
      '<span class="sub">' + K.sub + '</span></span>' +
      '<span class="tally' + (n ? "" : " zero") + '">' + n + '</span></button>';
  }).join("") + '</div>';

  view.innerHTML = stripHTML() +
    '<div class="picked">' + fmtDay(logDate) + '<span>' + status + '</span></div>' +
    (mayAdd
      ? '<label style="margin-top:18px">' + T().prompt + '</label>' + tiles
      : '<div class="hint" style="margin-top:16px">This day is closed. You can log today and the ' +
        (backfillDays() - 1) + ' days before it.</div>') +
    (items.length
      ? '<div class="sec"><div class="sechead"><div class="eyebrow">Logged</div>' +
          '<div class="eyebrow">' + (mayEdit ? "TAP TO CHANGE" : "LOCKED") + '</div></div>' +
          '<div class="ilist">' + items.slice().sort(itemOrder).map(it =>
            '<button class="irow" data-i="' + it.id + '" style="--c:' + KINDS[it.kind].hex + '"' +
              (mayEdit ? "" : " disabled") + '>' +
              '<span class="pip"></span>' +
              '<span class="t"><b>' + esc(KINDS[it.kind].label) + '</b>' +
              '<i>' + esc(itemSummary(it)) + '</i></span>' +
              (mayEdit ? '<span class="go">&rsaquo;</span>' : '') + '</button>').join("") +
          '</div></div>'
      : "") +
    '<div class="hint">' + (mayAdd
      ? 'Tap a day in the strip above to catch up on the last ' + backfillDays() +
        ' days. Once a day is past you can still add to it, but nothing already ' +
        'down can be changed — so the record stays honest.'
      : 'Locked. Anything logged on this day stands.') +
      (T().hint ? '<br>' + T().hint : '') + '</div>';

  view.querySelectorAll(".dsel button").forEach(b => b.onclick = () => pickLogDate(b.dataset.d));
  view.querySelectorAll(".tile").forEach(b => b.onclick = () => itemSheet(b.dataset.k, null));
  view.querySelectorAll(".irow").forEach(b => {
    if(!b.disabled) b.onclick = () => {
      const it = liveItems(logDate).find(x => x.id === b.dataset.i);
      if(it) itemSheet(it.kind, it);
    };
  });
}
/* group a day by kind so it reads as a day, not a stream */
function itemOrder(a, b){
  return KORDER.indexOf(a.kind) - KORDER.indexOf(b.kind) ||
    String(a.created_at || "").localeCompare(String(b.created_at || ""));
}

/* The logging sheet. One chip group per field; `existing` means we are editing
   an instance already down rather than adding one. */
function itemSheet(kindKey, existing){
  const K = KINDS[kindKey];
  if(!K) return;
  const form = {};
  K.fields.forEach(f => {
    form[f.key] = existing ? existing[f.key]
                : f.multi  ? []
                : f.clock  ? clockDefault(f.clock)
                : null;
    if(f.multi && !Array.isArray(form[f.key])) form[f.key] = [];
  });

  const groups = K.fields.map(f =>
    '<label>' + esc(f.label) + (f.multi ? ' <span style="text-transform:none;letter-spacing:0">' +
      '(tap all that apply)</span>' : '') + '</label>' +
    '<div class="cg" data-f="' + f.key + '" style="--c:' + K.hex + '">' +
      f.opts.map(o => '<button data-v="' + esc(o[0]) + '">' + esc(o[1]) + '</button>').join("") +
    '</div>').join("");

  openSheet('<h2>' + esc(K.label) + '</h2>' +
    '<div class="meta">' + esc(fmtDay(logDate).toUpperCase()) + '</div>' +
    groups +
    '<div class="acts"><button class="btn" onclick="closeSheet()">Cancel</button>' +
      '<button class="btn primary" id="isv">' + (existing ? "Update" : "Save") + '</button></div>' +
    (existing
      ? '<button class="btn danger" id="irm">Remove this ' + esc(K.label.toLowerCase()) + '</button>'
      : '<button class="btn" id="isva">Save and add another</button>') +
    '<div class="hint" id="ihint"></div>');

  const sheetEl = document.getElementById("sheet");
  const paint = () => {
    sheetEl.querySelectorAll(".cg").forEach(g => {
      const v = form[g.dataset.f];
      g.querySelectorAll("button").forEach(b => b.classList.toggle("on",
        Array.isArray(v) ? v.indexOf(b.dataset.v) !== -1 : v === b.dataset.v));
    });
    const miss = missing();
    document.getElementById("ihint").textContent = miss ? "Still need: " + miss : "";
    document.getElementById("isv").disabled = !!miss;
    const another = document.getElementById("isva");
    if(another) another.disabled = !!miss;
  };
  const missing = () => K.fields.filter(f => {
    const v = form[f.key];
    return f.multi ? !v.length : v == null;
  }).map(f => f.label.toLowerCase()).join(", ");

  sheetEl.querySelectorAll(".cg button").forEach(b => b.onclick = () => {
    const key = b.parentNode.dataset.f;
    const f = K.fields.find(x => x.key === key);
    buzz();
    if(f.multi){
      const at = form[key].indexOf(b.dataset.v);
      if(at === -1) form[key].push(b.dataset.v); else form[key].splice(at, 1);
    } else {
      form[key] = (form[key] === b.dataset.v) ? null : b.dataset.v;
    }
    paint();
  });

  const commit = again => {
    if(missing()) return;
    /* backfilling is a one-shot: the day it describes has already passed, so it
       is locked the instant it is written */
    if(!existing && !canEditItem(logDate) &&
       !confirm(fmtDay(logDate) + " is already past, so anything you add to it locks as soon as " +
                "you save and cannot be changed afterwards.\n\nSave it?")) return;
    const item = Object.assign({kind:kindKey}, form);
    if(existing){ item.id = existing.id; item.created_at = existing.created_at; }
    if(!putItem(logDate, item)) return toast("That day is locked", "Nothing was saved");
    buzz(); renderHeader(); renderBanners(); renderLog(); stale.log = false;
    toast(K.label + (existing ? " updated" : " logged"), itemSummary(item));
    if(again) itemSheet(kindKey, null); else closeSheet();
  };
  document.getElementById("isv").onclick = () => commit(false);
  const another = document.getElementById("isva");
  if(another) another.onclick = () => commit(true);
  const rm = document.getElementById("irm");
  if(rm) rm.onclick = () => {
    if(!confirm("Remove this " + K.label.toLowerCase() + "?")) return;
    removeItem(logDate, existing.id);
    renderHeader(); renderBanners(); renderLog(); stale.log = false;
    closeSheet(); toast(K.label + " removed", fmtShort(logDate));
  };
  paint();
}


/* in-place update of everything on the Log pane that depends on state */
function syncLog(){
  const view = PANE.log, existing = index.get(logDate);
  if(!view.querySelector("#sv")) return;          /* summary mode — nothing to sync */
  view.querySelectorAll(".rate").forEach(b => b.classList.toggle("on", b.dataset.r === draft.rating));
  view.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.x === draft.reason));
  view.querySelector(".chips").classList.toggle("off", !draft.rating);
  const sv = view.querySelector("#sv");
  sv.disabled = !(draft.rating && draft.reason);
  sv.textContent = (existing ? "Update this " : "Save this ") + T().noun;
  view.querySelector("#rm").hidden = !existing;
  view.querySelector(".picked span").textContent =
    existing ? "ALREADY LOGGED · EDITING" : "NOT LOGGED YET";
  view.querySelectorAll(".dsel button").forEach(b => {
    const e = index.get(b.dataset.d);
    b.classList.toggle("lit", !!e);
    if(e) b.style.setProperty("--c", RATINGS[e.rating].hex); else b.style.removeProperty("--c");
  });
}

/* ================= HISTORY TAB ================= */
let calY = new Date().getFullYear(), calM = new Date().getMonth();

/* habits have no colour split to summarise a month with, so the month reads as
   how often each habit happened: total instances, and how many days it landed on */
function monthKindRows(y, m){
  const dim = new Date(y, m + 1, 0).getDate();
  const n = zeroed(KORDER), days = zeroed(KORDER);
  for(let d = 1; d <= dim; d++){
    const seen = {};
    liveItems(keyOf(new Date(y, m, d))).forEach(it => { n[it.kind]++; seen[it.kind] = 1; });
    KORDER.forEach(x => { if(seen[x]) days[x]++; });
  }
  const max = Math.max(1, ...KORDER.map(x => n[x]));
  return '<div class="mix">' + KORDER.map(x =>
    '<div class="mixrow" style="--c:' + KINDS[x].hex + '">' +
      '<i class="sw"></i>' +
      '<span class="ml">' + KINDS[x].label + '</span>' +
      '<span class="mb"><i style="width:' + (n[x] / max * 100) + '%"></i></span>' +
      '<span class="mv">' + n[x] + '</span>' +
      '<span class="mn">' + days[x] + 'd</span></div>').join("") + '</div>' +
    '<div class="hint">Left number is how many times; right is how many days it landed on.</div>';
}

function renderHistory(){
  const view = PANE.history;
  const first = new Date(calY, calM, 1);
  const pad = first.getDay();
  const dim = new Date(calY, calM+1, 0).getDate();
  const now = new Date(), atNow = (calY === now.getFullYear() && calM === now.getMonth());

  let cells = "";
  for(let i = 0; i < pad; i++) cells += '<div class="pad"></div>';
  const counts = zeroed(RORDER); let logged = 0, elapsed = 0;
  for(let d = 1; d <= dim; d++){
    const k = keyOf(new Date(calY, calM, d));
    const e = index.get(k), future = agoOf(k) < 0;
    if(!future) elapsed++;
    if(e && !isLog()){ counts[e.rating]++; logged++; }
    if(e && isLog()) logged++;
    const open = isLog() ? canAddItem(k) : editable(k);
    cells += '<button class="cell ' + (isLog() ? "hab" + (e ? " has" : "") : (e ? RATINGS[e.rating].cls : "")) +
      (future ? " future" : "") + (k === todayKey() ? " today" : "") +
      (!open && !future ? " locked" : "") + '" data-d="' + k + '"' +
      (future ? " disabled" : "") + '>' + d +
      (isLog() ? dotsHTML(k) : (e && e.note ? '<span class="nt"></span>' : '')) + '</button>';
  }

  view.innerHTML =
    '<div class="mhead">' +
      '<div class="m">' + first.toLocaleDateString([], {month:"long", year:"numeric"}) + '</div>' +
      '<div class="mnav">' +
        '<button class="tdy" id="td"' + (atNow ? " disabled" : "") + '>Today</button>' +
        '<button class="arw" id="pm">&lsaquo;</button>' +
        '<button class="arw" id="nm"' + (atNow ? " disabled" : "") + '>&rsaquo;</button>' +
      '</div>' +
    '</div>' +
    '<div class="wdays"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>' +
    '<div class="cal">' + cells + '</div>' +
    '<div class="legend">' +
      (isLog()
        ? KORDER.map(x => '<div><i style="border-radius:50%;background:' + KINDS[x].hex +
            '"></i><span style="color:var(--dim)">' + KINDS[x].label + '</span></div>').join("")
        : RORDER.map(r => '<div style="color:' + RATINGS[r].hex + '"><i class="' +
            (RATINGS[r].extra ? "halo" : "") + '" style="border-radius:50%;background:' + RATINGS[r].hex +
            '"></i><span style="color:var(--dim)">' + RATINGS[r].label + '</span></div>').join("")) +
      '<div><i style="border-radius:50%;background:var(--surface);border:1px solid var(--line)"></i>Not logged</div>' +
    '</div>' +
    '<div class="sec"><div class="sechead"><div class="eyebrow">This month</div>' +
      '<div class="eyebrow">' + logged + ' of ' + nOf(elapsed) + ' logged</div></div>' +
      (isLog()
        ? (logged ? monthKindRows(calY, calM)
                  : '<div class="empty">Nothing logged this month yet.</div>')
        : (logged ? splitBar(counts, logged) + mixRows(counts, logged)
                  : '<div class="empty">No ' + T().nounPl + ' logged this month yet.</div>')) +
    '</div>' +
    '<div class="hint" style="margin-top:18px">Tap a day to see what you put down. ' +
      'Changes are made on the Log tab.</div>';

  document.getElementById("pm").onclick = () => {
    calM--; if(calM < 0){ calM = 11; calY--; } renderHistory();
  };
  document.getElementById("nm").onclick = () => {
    if(atNow) return;
    calM++; if(calM > 11){ calM = 0; calY++; } renderHistory();
  };
  document.getElementById("td").onclick = () => {
    if(atNow) return;
    const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); renderHistory();
  };
  view.querySelectorAll(".cal .cell").forEach(b => {
    if(!b.disabled) b.onclick = () => daySheet(b.dataset.d);
  });
}

/* Read-only. Every edit happens on the Log tab, so a tap in the calendar can
   never change what a day says. */
function daySheet(k){
  const e = index.get(k);
  let body = '<h2>' + fmtDay(k) + '</h2><div class="meta">' +
    (agoOf(k) <= 1
      ? dateOf(k).toLocaleDateString([], {month:"long", day:"numeric", year:"numeric"}).toUpperCase()
      : agoOf(k) + " DAYS AGO") + '</div>';

  const items = isLog() ? liveItems(k).slice().sort(itemOrder) : [];
  body += isLog()
    ? (items.length
        ? '<div class="ilist">' + items.map(it =>
            '<div class="irow" style="--c:' + KINDS[it.kind].hex + '">' +
              '<span class="pip"></span>' +
              '<span class="t"><b>' + esc(KINDS[it.kind].label) + '</b>' +
              '<i>' + esc(itemSummary(it)) + '</i></span></div>').join("") + '</div>'
        : '<div class="readout"><div style="color:var(--dim);font-size:14px">' +
            'No habits logged for this day.</div></div>')
    : e
      ? readoutHTML(e)
      : '<div class="readout"><div style="color:var(--dim);font-size:14px">Nothing logged on the ' +
          T().label.toLowerCase() + ' tracker for this day.</div></div>';

  body += '<div class="hint">' + (isLog()
    ? (canEditItem(k) ? 'To add to this or change it, open it on the Log tab.'
     : canAddItem(k)  ? 'You can still add to this day on the Log tab, but what is already down stands.'
     :                  'Locked. Anything logged on this day stands.')
    : (canChange(k) ? 'To change this, open it on the Log tab.'
     : canEnter(k)  ? 'Not logged yet — you can still fill it in on the Log tab.'
     : e            ? 'Locked. ' + lockLine()
     :                'Closed — outside the last ' + backfillDays() + ' ' + T().nounPl + '.')) + '</div>' +
    '<button class="btn" onclick="closeSheet()">Close</button>';

  openSheet(body);
}

/* ================= CHARTS TAB ================= */
const RANGES = [{k:"30", label:"30 days", days:30}, {k:"90", label:"90 days", days:90},
                {k:"365", label:"1 year", days:365}, {k:"all", label:"All", days:null}];
let range = "30";

function inRange(){
  const r = RANGES.find(x => x.k === range);
  const all = live();
  if(!r.days) return all;
  const cut = shiftKey(todayKey(), -(r.days - 1));
  return all.filter(e => e.date >= cut);
}
function splitBar(counts, total){
  return '<div class="bigsplit">' + RORDER.map(r =>
    '<i style="width:' + (total ? counts[r] / total * 100 : 0) + '%;background:' + RATINGS[r].hex + '"></i>'
  ).join("") + '</div>';
}
function mixRows(counts, total){
  return '<div class="mix">' + RORDER.map(r =>
    '<div class="mixrow' + (RATINGS[r].extra ? " extra" : "") + '" style="--c:' + RATINGS[r].hex + '">' +
      '<i class="sw"></i>' +
      '<span class="ml">' + RATINGS[r].label + '</span>' +
      '<span class="mb"><i style="width:' + (total ? counts[r] / total * 100 : 0) + '%"></i></span>' +
      '<span class="mv">' + pct(counts[r], total) + '%</span>' +
      '<span class="mn">' + counts[r] + '</span></div>'
  ).join("") + '</div>';
}
function trackRow(title, right, parts, keyDefs, total){
  return '<div class="row"><div class="rl"><b>' + title + '</b><span>' + right + '</span></div>' +
    '<div class="track">' + keyDefs.map(d =>
      '<i style="width:' + (total ? parts[d.k] / total * 100 : 0) + '%;background:' + d.hex + '"></i>'
    ).join("") + '</div></div>';
}
function reasonKey(){
  return '<div class="rkey">' + XORDER.map(x =>
    '<div><i style="background:' + REASONS[x].hex + '"></i>' + REASONS[x].label + '</div>').join("") + '</div>';
}
function ratingKey(){
  return '<div class="rkey">' + RORDER.map(r =>
    '<div><i style="background:' + RATINGS[r].hex + '"></i>' + RATINGS[r].label + '</div>').join("") + '</div>';
}

function renderCharts(){
  if(isLog()) return renderHabitCharts();
  const view = PANE.charts;
  /* a row filed under a reason since removed still shows on Log and History —
     it just cannot be counted into a breakdown that has no bucket for it */
  const rows = inRange().filter(e => knownReason(e.reason));
  const total = rows.length;
  const bar = '<div class="rangebar">' + RANGES.map(r =>
    '<button data-k="' + r.k + '"' + (range === r.k ? ' class="on"' : '') + '>' + r.label + '</button>').join("") + '</div>';

  if(!total){
    view.innerHTML = bar + '<div class="empty">No ' + T().nounPl + ' logged in this range yet.<br>Log a few and the picture shows up here.</div>';
    view.querySelectorAll(".rangebar button").forEach(b => b.onclick = () => { range = b.dataset.k; renderCharts(); });
    return;
  }

  const counts = zeroed(RORDER), rCounts = zeroed(XORDER);
  const byRating = {}; RORDER.forEach(r => byRating[r] = zeroed(XORDER));
  const byReason = {}; XORDER.forEach(x => byReason[x] = zeroed(RORDER));
  const wd = [0,1,2,3,4,5,6].map(() => Object.assign(zeroed(RORDER), {n:0}));
  rows.forEach(e => {
    counts[e.rating]++; rCounts[e.reason]++;
    byRating[e.rating][e.reason]++; byReason[e.reason][e.rating]++;
    const w = wd[dateOf(e.date).getDay()];
    w[e.rating]++; w.n++;
  });

  const rdefs = XORDER.map(x => ({k:x, hex:REASONS[x].hex}));
  const cdefs = RORDER.map(r => ({k:r, hex:RATINGS[r].hex}));

  /* streaks over the whole log, not just the range */
  const all = live().slice().sort((a,b) => a.date.localeCompare(b.date));
  let best = 0, run = 0, prev = null;
  all.forEach(e => {
    run = (isGood(e.rating) && prev && e.date === shiftKey(prev, 1)) ? run + 1
        : (isGood(e.rating) ? 1 : 0);
    if(run > best) best = run;
    prev = e.date;
  });
  let cur = 0, walk = index.has(todayKey()) ? todayKey() : shiftKey(todayKey(), -1);
  while(true){
    const e = index.get(walk);
    if(!e || !isGood(e.rating)) break;
    cur++; walk = shiftKey(walk, -1);
  }
  const goodDays = RORDER.filter(isGood).reduce((n,r) => n + counts[r], 0);
  const badDays  = counts.red + counts.xred;
  const wdMax = Math.max(1, ...wd.map(w => w.n));
  const topReason = XORDER.slice().sort((a,b) => rCounts[b] - rCounts[a])[0];
  const topFor = r => XORDER.slice().sort((a,b) => byRating[r][b] - byRating[r][a])[0];
  const greenTop = topFor("green"), redTop = topFor("red");

  view.innerHTML = bar +
    '<div class="sec"><div class="sechead"><div class="eyebrow">' + T().mix + '</div>' +
      '<div class="eyebrow">' + total + ' logged</div></div>' +
      splitBar(counts, total) + mixRows(counts, total) + '</div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">Behind each colour</div></div>' +
      '<div class="card">' +
      RORDER.map(r => counts[r]
        ? trackRow(RATINGS[r].label + " " + T().nounPl, counts[r] + " · mostly " +
            reasonPhrase(XORDER.slice().sort((a,b) => byRating[r][b] - byRating[r][a])[0]),
            byRating[r], rdefs, counts[r])
        : trackRow(RATINGS[r].label + " " + T().nounPl, "none", byRating[r], rdefs, 0)).join("") +
      reasonKey() + '</div></div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">Each reason&rsquo;s record</div></div>' +
      '<div class="card">' +
      XORDER.map(x => trackRow(REASONS[x].label,
        rCounts[x] ? nOf(rCounts[x]) + " · " + pct(byReason[x].green, rCounts[x]) + "% green" : "none",
        byReason[x], cdefs, rCounts[x])).join("") +
      ratingKey() + '</div></div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">By day of week</div></div>' +
      '<div class="card"><div class="wbars">' +
      wd.map((w, i) => '<div class="wbar"><div class="stack" style="height:' + (w.n / wdMax * 100) + '%">' +
        RORDER.map(r => '<i style="height:' + (w.n ? w[r] / w.n * 100 : 0) + '%;background:' + RATINGS[r].hex + '"></i>').join("") +
        '</div><div class="wl">' + "SMTWTFS"[i] + '</div></div>').join("") +
      '</div><p style="margin-top:12px">Bar height is how many of that weekday you logged; the colours are how they went.</p></div></div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">Numbers</div></div>' +
      '<div class="stats">' +
      '<div class="stat"><div class="v" style="color:var(--green)">' + cur + '</div>' +
        '<div class="k">Good streak now</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--green)">' + best + '</div>' +
        '<div class="k">Longest good streak</div></div>' +
      '</div></div>' +

    '<div class="sec"><div class="card"><h3>The short version</h3><p>' +
      'Over ' + (RANGES.find(x => x.k === range).days ? "the last " + RANGES.find(x => x.k === range).label : "everything logged") +
      ', <b>' + pct(goodDays, total) + '%</b> of your ' + T().nounPl + ' came out green or better' +
      (counts.xgreen ? ', including ' + counts.xgreen + ' you called extra green' : '') + '. ' +
      REASONS[topReason].label + ' is the reason you point at most often (' +
      pct(rCounts[topReason], total) + '% of ' + T().nounPl + '). ' +
      (counts.green ? "Green " + T().nounPl + " are usually down to " + reasonPhrase(greenTop) + ". " : "") +
      (counts.red ? "Red " + T().nounPl + " are usually down to " + reasonPhrase(redTop) + ". " : "") +
      (counts.xred ? counts.xred + " " + T().noun + (counts.xred === 1 ? " was" : "s were") + " extra red." :
        (badDays ? "" : "Nothing landed in the red.")) +
      '</p></div></div>';

  view.querySelectorAll(".rangebar button").forEach(b => b.onclick = () => { range = b.dataset.k; renderCharts(); });
}

/* ================= CHARTS TAB — habits ================= */
/* one option's share of a field, e.g. how the caffeine splits across the day */
function fieldRows(items, kindKey, fieldKey){
  const f = KINDS[kindKey].fields.find(x => x.key === fieldKey);
  const counts = {}; f.opts.forEach(o => counts[o[0]] = 0);
  let n = 0;
  items.filter(i => i.kind === kindKey).forEach(i => {
    const v = fieldValue(i, fieldKey);
    (Array.isArray(v) ? v : [v]).forEach(x => {
      if(Object.prototype.hasOwnProperty.call(counts, x)){ counts[x]++; n++; }
    });
  });
  const max = Math.max(1, ...f.opts.map(o => counts[o[0]]));
  return '<div class="mix">' + f.opts.map(o =>
    '<div class="mixrow" style="--c:' + KINDS[kindKey].hex + '">' +
      '<i class="sw"></i><span class="ml">' + esc(o[1]) + '</span>' +
      '<span class="mb"><i style="width:' + (counts[o[0]] / max * 100) + '%"></i></span>' +
      '<span class="mv">' + counts[o[0]] + '</span>' +
      '<span class="mn">' + pct(counts[o[0]], n) + '%</span></div>').join("") + '</div>';
}

/* every live row of another tracker, by date — the one place anything reads
   across trackers, and it never writes */
function rowsOf(tk){
  const m = new Map();
  entries.forEach(e => { if(!e.deleted_at && trackerOf(e) === tk && e.rating) m.set(e.date, e); });
  return m;
}
/* Habits on day D are joined to Sleep on D+1 — a night belongs to the day it
   ended on, so the day that caused it is the one before — and to Days on D. */
function joinTo(tk, offset){
  const target = rowsOf(tk), out = [];
  inRange().forEach(row => {
    const items = (Array.isArray(row.items) ? row.items : []).filter(it => knownKind(it.kind));
    if(!items.length) return;
    const t = target.get(shiftKey(row.date, offset));
    if(t) out.push({items:items, rating:t.rating});
  });
  return out;
}
const ozOf = its => its.filter(i => i.kind === "caffeine")
  .reduce((n, i) => n + (Number(i.oz) || 0), 0);
function medianOz(rows){
  const v = rows.map(r => ozOf(r.items)).sort((a,b) => a - b);
  if(!v.length) return 0;
  const h = Math.floor(v.length / 2);
  return v.length % 2 ? v[h] : (v[h-1] + v[h]) / 2;
}
const has = (its, kind, fn) => its.some(i => i.kind === kind && (!fn || fn(i)));
/* protein is a level now; "yes" is what the old yes/no wrote, and reads as the
   middle of the new scale so existing meals still count as protein */
const proteinRank = v => v === "high" ? 3 : v === "medium" || v === "yes" ? 2
                       : v === "low" ? 1 : 0;

/* Each comparison splits the joined days in two and reports how each half
   turned out. Deliberately not a correlation coefficient: the inputs are
   categorical and the sample is small, and a split with its counts beside it
   cannot imply precision it does not have. */
const COMPARISONS = [
  {t:"sleep", off:1, label:"Caffeine after 12pm", a:"After 12pm", b:"None late",
   f:its => has(its, "caffeine", i => i.slot === "t12_15" || i.slot === "post15")},
  {t:"sleep", off:1, label:"Caffeine above your usual", a:"Above median", b:"At or below",
   f:(its, c) => ozOf(its) > c.med, need:c => c.med > 0},
  {t:"sleep", off:1, label:"Exercised that day", a:"Exercised", b:"Did not",
   f:its => has(its, "exercise")},
  {t:"sleep", off:1, label:"Hard exercise", a:"Hard", b:"Easier or none",
   f:its => has(its, "exercise", i => i.effort === "hard")},
  {t:"sleep", off:1, label:"Napped", a:"Napped", b:"No nap",
   f:its => has(its, "nap")},
  {t:"sleep", off:1, label:"Nap after 3pm", a:"Late nap", b:"Early or none",
   f:its => has(its, "nap", i => i.slot === "post15")},
  {t:"sleep", off:1, label:"Late snack", a:"Late snack", b:"None",
   f:its => has(its, "meal", i => i.meal === "late")},
  {t:"sleep", off:1, label:"High sugar", a:"High", b:"Lower or none",
   f:its => has(its, "sugar", i => i.amount === "high")},
  {t:"days", off:0, label:"High sugar", a:"High", b:"Lower or none",
   f:its => has(its, "sugar", i => i.amount === "high")},
  {t:"days", off:0, label:"Sugar you bought", a:"Bought", b:"From home or none",
   f:its => has(its, "sugar", i => fieldValue(i, "bought") === "yes")},
  {t:"days", off:0, label:"Two or more solid-protein meals", a:"Two or more", b:"Fewer",
   f:its => its.filter(i => i.kind === "meal" && proteinRank(i.protein) >= 2).length >= 2},
  {t:"days", off:0, label:"Exercised that day", a:"Exercised", b:"Did not",
   f:its => has(its, "exercise")}
];
const MIN_SIDE = 8, MIN_TOTAL = 14;

function corrBlock(tk){
  const label = TRACKERS[tk].label;
  const rows = joinTo(tk, tk === "sleep" ? 1 : 0);
  const head = '<div class="sec"><div class="sechead"><div class="eyebrow">Against ' + label +
    '</div><div class="eyebrow">' + rows.length + ' matched</div></div>';

  if(rows.length < MIN_TOTAL){
    return head + '<div class="empty">Not enough overlap yet — ' + rows.length + ' of ' + MIN_TOTAL +
      ' days.<br>Keep logging both and this fills in.</div></div>';
  }
  const ctx = {med: medianOz(rows)};
  const cards = COMPARISONS.filter(c => c.t === tk && (!c.need || c.need(ctx))).map(c => {
    const yes = rows.filter(r => c.f(r.items, ctx));
    const no  = rows.filter(r => !c.f(r.items, ctx));
    if(yes.length < MIN_SIDE || no.length < MIN_SIDE) return "";
    const g = set => pct(set.filter(r => isGood(r.rating)).length, set.length);
    const gy = g(yes), gn = g(no), diff = gy - gn;
    const bar = (name, p, n) => '<div class="cbar"><span class="cl">' + esc(name) + '</span>' +
      '<span class="cm"><i style="width:' + p + '%"></i></span>' +
      '<span class="cv">' + p + '%</span><span class="cn">' + n + '</span></div>';
    return '<div class="card corr" style="--c:' + RATINGS.green.hex + '">' +
      '<div class="ch">' + esc(c.label) + '</div>' +
      bar(c.a, gy, yes.length) + bar(c.b, gn, no.length) +
      '<div class="gap">' + (Math.abs(diff) < 5
        ? "No real difference so far."
        : Math.abs(diff) + " points " + (diff > 0 ? "better" : "worse") +
          (tk === "sleep" ? " on the nights after." : " on the days it happened.")) +
      '</div></div>';
  }).filter(Boolean);

  return head + (cards.length
    ? '<div class="hint">Each bar is the share of ' + (tk === "sleep" ? "nights" : "days") +
      ' that came out green or better, with how many beside it.</div>' + cards.join("")
    : '<div class="empty">Nothing has both sides logged often enough yet.<br>' +
      'Each comparison needs ' + MIN_SIDE + ' days either way.</div>') + '</div>';
}

function renderHabitCharts(){
  const view = PANE.charts;
  const bar = '<div class="rangebar">' + RANGES.map(r =>
    '<button data-k="' + r.k + '"' + (range === r.k ? ' class="on"' : '') + '>' + r.label + '</button>').join("") + '</div>';
  const bind = () => view.querySelectorAll(".rangebar button")
    .forEach(b => b.onclick = () => { range = b.dataset.k; renderHabitCharts(); });

  const days = inRange();
  const items = days.reduce((a, r) =>
    a.concat((Array.isArray(r.items) ? r.items : []).filter(it => knownKind(it.kind))), []);

  if(!items.length){
    view.innerHTML = bar + '<div class="empty">No habits logged in this range yet.<br>' +
      'Log a few and the picture shows up here.</div>';
    bind(); return;
  }

  const n = zeroed(KORDER), onDays = zeroed(KORDER);
  days.forEach(r => {
    const seen = {};
    (Array.isArray(r.items) ? r.items : []).forEach(it => {
      if(!knownKind(it.kind)) return;
      n[it.kind]++; seen[it.kind] = 1;
    });
    KORDER.forEach(x => { if(seen[x]) onDays[x]++; });
  });
  const max = Math.max(1, ...KORDER.map(x => n[x]));
  const dayCount = days.length;

  view.innerHTML = bar +
    '<div class="sec"><div class="sechead"><div class="eyebrow">' + T().mix + '</div>' +
      '<div class="eyebrow">' + dayCount + ' days logged</div></div>' +
      '<div class="mix">' + KORDER.map(x =>
        '<div class="mixrow" style="--c:' + KINDS[x].hex + '">' +
          '<i class="sw"></i><span class="ml">' + KINDS[x].label + '</span>' +
          '<span class="mb"><i style="width:' + (n[x] / max * 100) + '%"></i></span>' +
          '<span class="mv">' + n[x] + '</span>' +
          '<span class="mn">' + onDays[x] + 'd</span></div>').join("") + '</div>' +
      '<div class="hint">How many times, and how many days it landed on.</div></div>' +

    (n.caffeine ? '<div class="sec"><div class="sechead"><div class="eyebrow">Caffeine</div>' +
      '<div class="eyebrow">' + (n.caffeine / Math.max(1, dayCount)).toFixed(1) + ' a day</div></div>' +
      '<div class="card">' + fieldRows(items, "caffeine", "slot") +
      fieldRows(items, "caffeine", "oz") + '</div></div>' : "") +

    (n.exercise ? '<div class="sec"><div class="sechead"><div class="eyebrow">Exercise</div>' +
      '<div class="eyebrow">' + pct(onDays.exercise, dayCount) + '% of days</div></div>' +
      '<div class="card">' + fieldRows(items, "exercise", "types") +
      fieldRows(items, "exercise", "effort") + '</div></div>' : "") +

    (n.meal ? '<div class="sec"><div class="sechead"><div class="eyebrow">Meals</div>' +
      '<div class="eyebrow">' + (n.meal / Math.max(1, dayCount)).toFixed(1) + ' a day</div></div>' +
      '<div class="card">' + fieldRows(items, "meal", "meal") +
      fieldRows(items, "meal", "protein") + '</div></div>' : "") +

    (n.sugar ? '<div class="sec"><div class="sechead"><div class="eyebrow">Sugar</div>' +
      '<div class="eyebrow">' + pct(onDays.sugar, dayCount) + '% of days</div></div>' +
      '<div class="card">' + fieldRows(items, "sugar", "amount") +
      fieldRows(items, "sugar", "bought") + '</div></div>' : "") +

    (n.nap ? '<div class="sec"><div class="sechead"><div class="eyebrow">Naps</div>' +
      '<div class="eyebrow">' + pct(onDays.nap, dayCount) + '% of days</div></div>' +
      '<div class="card">' + fieldRows(items, "nap", "mins") +
      fieldRows(items, "nap", "slot") + '</div></div>' : "") +

    corrBlock("sleep") + corrBlock("days") +

    '<div class="sec"><div class="card"><h3>Reading these</h3><p>' +
      'Each split shows how the nights or days went either side of one habit, with the ' +
      'count beside it. A night is matched to the day before it; a day to itself. ' +
      'With a dozen splits on a few weeks of logging, one or two will look meaningful ' +
      'by chance — treat anything here as worth watching, not as cause and effect.' +
      '</p></div></div>';

  bind();
}

/* ================= nav ================= */
const RENDER = {log:renderLog, history:renderHistory, charts:renderCharts};
function go(t){
  const same = (t === tab);
  if(!same) scrollMem[tab] = SCROLLER.scrollTop;
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  for(const k in PANE) PANE[k].classList.toggle("on", k === t);
  if(stale[t]){ RENDER[t](); stale[t] = false; }
  if(!same) SCROLLER.scrollTop = scrollMem[t] || 0;
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

/* Switching tracker keeps the tab you are on but rebuilds all three panes: the
   index, the draft and every chart are scoped to one tracker at a time. */
function setTracker(t){
  if(t === tracker || !TRACKERS[t]) return;
  scrollMem[tab] = SCROLLER.scrollTop;
  applyTracker(t);
  meta.tracker = t;
  lsSet(LS_META, meta); idbPut("meta", meta);
  reindex();
  const back = agoOf(logDate);
  if(back < 0 || back > STRIP_BACK) logDate = todayKey();
  logEditing = false; loadDraft();
  stale.log = stale.history = stale.charts = true;
  scrollMem.log = scrollMem.history = scrollMem.charts = 0;
  renderHeader(); refreshCurrent();
  SCROLLER.scrollTop = 0;
  buzz();
}
document.querySelectorAll("#tsw button")
  .forEach(b => b.addEventListener("click", () => setTracker(b.dataset.t)));

    '<button class="btn" onclick="copyBackup()">Copy backup as text</button>' +
    '<div class="hint">Works anywhere. Paste it into a Drive document, a note, or an ' +
      'email to yourself.</div>' +
    '<button class="btn" onclick="exportCSV()">Export spreadsheet (CSV)</button>' +
    '<label for="imp">Restore from a file</label>' +
    '<input type="file" id="imp" accept="application/json,text/plain,.json,.txt">' +
    '<label for="pastebox">Or paste a backup</label>' +
    '<textarea id="pastebox" placeholder="Paste copied backup text here"></textarea>' +
    '<button class="btn" onclick="restorePasted()">Restore from pasted text</button>' +
    '<div class="hint">One backup holds both trackers. Either way entries merge by ' +
      'tracker and date and the newer version wins — restoring never loses what you ' +
      'have already logged.</div>' +
    '<button class="btn" onclick="forceUpdate()">Check for update</button>' +
    (ERRORS.length ? '<label>Errors</label><div class="log">' + esc(ERRORS.join("\n")) + '</div>' : '') +
    '<button class="btn" onclick="closeSheet()">Close</button>');
  document.getElementById("imp").addEventListener("change", importJSON);
}
document.getElementById("gearBtn").addEventListener("click", dataSheet);

/* ================= export / import ================= */
function download(name, text, mime){
  try {
    const blob = new Blob([text], {type: mime});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch(err){ logErr("download", err); alert("Export failed. Check the Errors list."); }
}
const stamp = () => new Date().toISOString().slice(0,10);

/* Hand the file to the OS share sheet when there is one — that is the route to
   Google Drive, Files, iCloud, mail. Falls back to a plain download elsewhere. */
function sendFile(name, text, mime){
  try {
    const file = new File([text], name, {type: mime});
    /* files only — adding a title makes iOS treat this as a text share and offer
       apps that take text rather than apps that take documents */
    if(navigator.canShare && navigator.canShare({files:[file]}))
      return navigator.share({files:[file]}).then(() => "shared");
  } catch(e){ logErr("share", e); }
  download(name, text, mime);
  return Promise.resolve("downloaded");
}
function backupText(){
  return JSON.stringify({app:"days-tracker", schema_version:SCHEMA_VERSION, app_version:APP_VERSION,
    exported_at:new Date().toISOString(), entries:entries}, null, 2);
}
function markBackedUp(){
  meta.lastBackup = new Date().toISOString(); save(); refreshNotices();
  if(document.getElementById("imp")) dataSheet();
}
/* Clipboard route: works even when the share sheet offers nothing useful.
   Paste it into a Drive doc, a note, an email — anywhere that holds text. */
function copyBackup(){
  const text = backupText();
  const done = () => { markBackedUp(); toast("Backup copied", "Paste it somewhere safe"); };
  const manual = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); done(); }
    catch(e){ logErr("copy", e); alert("Could not copy automatically."); }
    ta.remove();
  };
  /* the async API needs a focused document; fall back quietly when it refuses */
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done).catch(manual);
  else manual();
}
function exportJSON(){
  const name = "days-backup-" + stamp() + ".json";
  sendFile(name, backupText(), "application/json").then(how => {
    markBackedUp();
    toast("Backup made", how === "shared" ? "Save it to Google Drive" : name);
  }).catch(err => {
    if(err && err.name === "AbortError") return;       /* user closed the share sheet */
    logErr("export", err); alert("Export failed. Check the Errors list.");
  });
}
function exportCSV(){
  const head = ["tracker","date","weekday","rating","reason","habit","detail","comment",
                "created_at","updated_at"];
  const q = s => '"' + String(s == null ? "" : s).replace(/"/g,'""') + '"';
  /* A rating row is one line. A habits row is one line per instance, so the
     file stays one thing per line and a spreadsheet can pivot it. */
  const HK = TRACKERS.habits.kinds;
  const detail = it => {
    const K = HK[it.kind];
    if(!K) return "";
    return K.fields.map(f => {
      const v = it[f.key];
      const name = x => { const o = f.opts.find(p => p[0] === x); return o ? o[1] : x; };
      if(f.multi) return (Array.isArray(v) ? v : []).map(name).join(" + ");
      return v == null ? "" : name(v);
    }).filter(Boolean).join(" · ");
  };
  const rows = [];
  entries.filter(e => !e.deleted_at).slice()
    .sort((a,b) => a.date.localeCompare(b.date) || trackerOf(a).localeCompare(trackerOf(b)))
    .forEach(e => {
      const base = [trackerOf(e), e.date, dateOf(e.date).toLocaleDateString([], {weekday:"long"})];
      const tail = [e.note, e.created_at, e.updated_at];
      if(Array.isArray(e.items)){
        e.items.forEach(it => rows.push(
          base.concat(["", "", it.kind, detail(it)]).concat(tail).map(q).join(",")));
      } else {
        rows.push(base.concat([e.rating, e.reason, "", ""]).concat(tail).map(q).join(","));
      }
    });
  sendFile("days-" + stamp() + ".csv", head.join(",") + "\n" + rows.join("\n"), "text/csv")
    .catch(err => { if(!err || err.name !== "AbortError") logErr("export csv", err); });
}
function ingest(text, what){
  try {
    const d = JSON.parse(text);
    const incoming = Array.isArray(d) ? d : d.entries;
    if(!Array.isArray(incoming)) throw new Error("no entries in it");
    const before = entries.length;
    entries = mergeSets(entries, incoming);
    save(); loadDraft(); renderHeader(); renderBanners();
    alert("Restored. " + (entries.length - before) + " new entries added, " + entries.length +
      " total — " + Object.keys(TRACKERS).map(t => live(t).length + " " + TRACKERS[t].nounPl).join(", ") + ".");
    closeSheet(); refreshCurrent();
  } catch(e){ logErr("import", e); alert("Could not read that " + what + ": " + e.message); }
}
function importJSON(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { ingest(r.result, "file"); ev.target.value = ""; };
  r.readAsText(f);
}
function restorePasted(){
  const ta = document.getElementById("pastebox");
  const txt = (ta && ta.value || "").trim();
  if(!txt) return alert("Paste a backup into the box first.");
  ingest(txt, "text");
}
function forceUpdate(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistrations().then(rs => {
      Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
    }).catch(() => location.reload(true));
  } else location.reload(true);
}

/* ================= boot ================= */
window.addEventListener("error", ev => logErr("uncaught", ev.error || ev.message));
document.addEventListener("visibilitychange", () => {
  /* midnight rollover while the app sat open */
  if(document.hidden) return;
  if(agoOf(logDate) < 0){ logDate = todayKey(); loadDraft(); stale.log = true; }
  if(stale[tab]) refreshCurrent();
  refreshNotices();
  if("serviceWorker" in navigator)
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
});
load().then(() => {
  loadDraft();
  renderHeader(); renderBanners();
  renderLog(); stale.log = false;
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(reg => {
      if(reg.waiting){ updateReady = true; refreshNotices(); }
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", () => {
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            updateReady = true; refreshNotices();
          }
        });
      });
    }).catch(e => logErr("sw", e));
  }
});
</script>
