<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Days</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Days">
<meta name="theme-color" content="#12151C">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#12151C; --surface:#1B1F29; --surface2:#232834; --line:#2E3440;
  --text:#E8EAEF; --dim:#8A93A6; --dimmer:#5C6478;
  --xgreen:#3FD07A; --green:#56A06B; --yellow:#E3A63F; --red:#C4605A; --xred:#F2453D;
  --me:#8A79C6; --others:#5B8ED8; --health:#4E9EA3;
  --warn:#E3A63F; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
/* The whole app is one non-scrolling column and only <main> scrolls. The nav is
   an ordinary flex item at the bottom of it, so it cannot be stranded by iOS
   re-anchoring position:fixed to a stale viewport. */
html{height:100%}
body{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header,#banners{flex:0 0 auto;width:100%;max-width:430px;margin-left:auto;margin-right:auto}
main{flex:1 1 auto;min-height:0;width:100%;max-width:430px;margin-left:auto;margin-right:auto;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);font-weight:600}

/* ---- header ---- */
header{padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 12px;border-bottom:1px solid var(--line)}
@media (display-mode:standalone){
  header{padding-top:calc(max(env(safe-area-inset-top), 44px) + 10px)}
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
/* which tracker you are looking at — the two live side by side and share nothing
   but the five colours */
.tsw{display:flex;gap:3px;padding:3px;border-radius:13px;background:var(--surface);
  border:1px solid var(--line);flex:0 0 auto}
.tsw button{padding:8px 15px;border-radius:10px;font-size:14px;font-weight:650;
  letter-spacing:-.01em;color:var(--dim);transition:background .16s ease,color .16s ease}
.tsw button.on{background:var(--surface2);color:var(--text)}
.tsw button:not(.on):active{background:var(--bg)}
.who{font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:.1em;
  display:inline-flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
  padding:0 5px;border-radius:9px;background:var(--warn);color:#12151C;
  font-size:10px;font-weight:700;letter-spacing:0}
.badge[hidden]{display:none}
.notice{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;margin-top:10px;
  border-radius:12px;background:rgba(227,166,63,.11);border:1px solid rgba(227,166,63,.32)}
.notice .ntx{flex:1;min-width:0;font-size:13px;line-height:1.45;color:#F0C989}
.notice .ntx b{display:block;font-weight:650;color:var(--warn)}
.notice .ntx span{color:#F0C989;opacity:.85}
.notice button{flex:0 0 auto;padding:8px 12px;border-radius:9px;background:rgba(227,166,63,.2);
  color:#F0C989;font-size:13px;font-weight:650}
.date{margin-top:5px;font-size:12px;color:var(--dim);font-family:var(--mono);letter-spacing:.04em}
/* ---- banners ---- */
.banner{margin:12px var(--pad) 0;padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.45;
  background:rgba(227,166,63,.11);border:1px solid rgba(227,166,63,.32);color:#F0C989;
  display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--warn);font-weight:600}
.banner button{color:#F0C989;text-decoration:underline;font-size:13px;flex:0 0 auto}

main{padding:0 var(--pad)}
.pane{display:none}
.pane.on{display:block}
button,.cell{touch-action:manipulation}
.sec{margin-top:24px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.empty{font-size:13px;color:var(--dimmer);line-height:1.5;padding:22px 0;text-align:center}

/* ---- day picker strip (Log tab) ---- */
.dsel{display:flex;gap:6px;margin-top:16px}
.dsel button{flex:1 1 0;min-width:0;padding:10px 0 9px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);text-align:center}
.dsel .wd{display:block;font-size:9px;letter-spacing:.06em;color:var(--dimmer);font-weight:650}
.dsel .dn{display:block;font-family:var(--mono);font-size:15px;margin-top:3px;color:var(--dim)}
/* a logged day wears its own colour, so the week reads as a trend at a glance */
.dsel button.lit{border-color:var(--c);background:var(--c)}
.dsel button.lit .dn{color:#12151C;font-weight:650}
.dsel button.lit .wd{color:rgba(18,21,28,.6)}
.dsel button.on{outline:2px solid var(--text);outline-offset:2px}
.dsel button.on:not(.lit){background:var(--surface2)}
.dsel button.on:not(.lit) .dn,.dsel button.on:not(.lit) .wd{color:var(--text)}

.picked{margin-top:18px;font-size:19px;font-weight:680;letter-spacing:-.01em}
.picked span{display:block;font-size:11px;font-family:var(--mono);color:var(--dimmer);
  letter-spacing:.06em;margin-top:3px;font-weight:400}

/* ---- rating tiles ---- */
.rates{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.rate{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);text-align:left;
  transition:transform .09s ease,background .16s ease,border-color .16s ease}
.rate:active{transform:scale(.985)}
.rate .swatch{width:16px;height:16px;border-radius:5px;background:var(--c);flex:0 0 auto}
.rate.extra .swatch{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.rate .t{flex:1;min-width:0}
.rate .lbl{display:block;font-size:15px;font-weight:620;letter-spacing:-.01em}
.rate .sub{display:block;font-size:11px;color:var(--dimmer);margin-top:2px}
.rate.on{background:var(--c);border-color:var(--c)}
.rate.on .lbl{color:#12151C} .rate.on .sub{color:rgba(18,21,28,.66)}
.rate.on .swatch{background:rgba(18,21,28,.28);box-shadow:none}

/* ---- reason chips ---- */
.chips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);text-align:left;
  transition:background .16s ease,border-color .16s ease,opacity .16s}
.chip:active{transform:scale(.985)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 auto}
.chip .t{flex:1;min-width:0}
.chip .t b{display:block;font-size:15px;font-weight:620;letter-spacing:-.01em}
.chip .t i{display:block;font-style:normal;font-size:11px;color:var(--dimmer);margin-top:2px}
.chip.on{background:var(--surface2);border-color:var(--c)}
.chips.off{opacity:.34;pointer-events:none}

/* ---- forms / buttons ---- */
label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
  font-weight:600;margin:18px 0 6px}
textarea,input[type=text]{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;font-size:16px;-webkit-appearance:none}
textarea{min-height:80px;resize:vertical;line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--dim);outline-offset:-1px;border-color:transparent}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--surface2);
  border:1px solid var(--line);font-size:15px;font-weight:600;text-align:center;margin-top:9px}
.btn:active{background:var(--line)}
.btn.primary{background:var(--text);color:#12151C;border-color:var(--text)}
.btn.primary[disabled]{background:var(--surface);color:var(--dimmer);border-color:var(--line)}
.btn.danger{color:var(--red)}
.acts{display:flex;gap:9px;margin-top:16px}
.acts .btn{margin-top:0}
.hint{font-size:12px;color:var(--dimmer);margin-top:9px;line-height:1.5}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-family:var(--mono);color:var(--dim)}
.log{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:pre-wrap;
  max-height:160px;overflow:auto;line-height:1.5;overflow-wrap:anywhere}

/* ---- calendar ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px}
.mhead .m{font-size:17px;font-weight:680;letter-spacing:-.01em}
.mnav{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.mnav button{height:34px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);color:var(--dim)}
.mnav .arw{width:34px;font-size:16px}
.mnav .tdy{padding:0 12px;font-size:12px;font-weight:650;letter-spacing:.02em}
.mnav button[disabled]{opacity:.3}
.mnav button:not([disabled]):active{background:var(--line)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wdays div{text-align:center;font-size:9px;letter-spacing:.1em;color:var(--dimmer);font-weight:650}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:7px}
.cal .cell{aspect-ratio:1/1;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;
  color:var(--dimmer);position:relative;transition:transform .08s ease}
.cal .cell:active{transform:scale(.93)}
.cal .pad{background:none;border:none}
.cal .cell.g{background:var(--green);border-color:var(--green);color:#12151C;font-weight:600}
.cal .cell.y{background:var(--yellow);border-color:var(--yellow);color:#12151C;font-weight:600}
.cal .cell.r{background:var(--red);border-color:var(--red);color:#12151C;font-weight:600}
.cal .cell.gg{background:var(--xgreen);border-color:var(--xgreen);color:#0A1710;font-weight:700;
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(63,208,122,.5)}
.cal .cell.rr{background:var(--xred);border-color:var(--xred);color:#1A0B0A;font-weight:700;
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(242,69,61,.5)}
.cal .cell.future{opacity:.28}
.cal .cell.today{outline:2px solid var(--text);outline-offset:2px}
.cal .cell .nt{position:absolute;bottom:6px;left:50%;margin-left:-2px;width:4px;height:4px;
  border-radius:50%;background:rgba(18,21,28,.45)}
.cal .cell.locked{opacity:.86}
.legend{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.legend i.halo{box-shadow:0 0 0 2px var(--bg),0 0 0 3px currentColor}

/* ---- charts ---- */
.rangebar{display:flex;gap:6px;margin-top:16px}
.rangebar button{flex:1;padding:9px 0;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--dim)}
.rangebar button.on{background:var(--surface2);border-color:var(--dim);color:var(--text)}
.bigsplit{display:flex;height:15px;border-radius:8px;overflow:hidden;margin-top:14px;background:var(--surface2)}
.bigsplit i{display:block;height:100%}
.mix{margin-top:12px}
.mixrow{display:flex;align-items:center;gap:9px;padding:7px 0}
.mixrow .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 auto}
.mixrow.extra .sw{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px color-mix(in srgb,var(--c) 55%,transparent)}
.mixrow .ml{font-size:13px;flex:0 0 84px}
.mixrow .mb{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.mixrow .mb i{display:block;height:100%;background:var(--c);border-radius:4px}
.mixrow .mv{font-family:var(--mono);font-size:13px;flex:0 0 38px;text-align:right}
.mixrow .mn{font-family:var(--mono);font-size:11px;color:var(--dimmer);flex:0 0 22px;text-align:right}
.row{margin-top:15px}
.row .rl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13px;margin-bottom:6px}
.row .rl b{font-weight:620;flex:0 1 auto;min-width:0}
.row .rl span{font-family:var(--mono);font-size:12px;color:var(--dim);
  flex:0 1 auto;min-width:0;text-align:right}
.track{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.track i{display:block;height:100%}
.rkey{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap}
.rkey div{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.rkey i{width:8px;height:8px;border-radius:50%;display:block}
.wbars{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:14px}
.wbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:5px}
.wbar .stack{width:100%;border-radius:5px 5px 0 0;overflow:hidden;display:flex;flex-direction:column-reverse}
.wbar .stack i{display:block;width:100%}
.wbar .wl{text-align:center;font-size:9px;color:var(--dimmer);font-weight:650;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
  font-weight:650;margin-top:7px;line-height:1.4}

/* ---- nav ---- */
nav{flex:0 0 auto;display:flex;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(0px,calc(50% - 215px));padding-right:max(0px,calc(50% - 215px))}
nav button{position:relative;flex:1;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:650;color:var(--dimmer);line-height:1.1;
  padding:11px 0 calc(11px + clamp(0px, env(safe-area-inset-bottom), 6px))}
nav button.on{color:var(--text)}
nav button .ind{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:18px;height:2px;border-radius:0 0 2px 2px;background:transparent}
nav button.on .ind{background:var(--text)}

/* ---- sheet + toast ---- */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.62);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:max(0px,calc(50% - 215px));right:max(0px,calc(50% - 215px));bottom:0;z-index:60;
  background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:8px var(--pad) calc(20px + env(safe-area-inset-bottom));
  transform:translateY(102%);pointer-events:none;
  transition:transform .24s cubic-bezier(.32,.72,0,1);max-height:90vh;max-height:90dvh;overflow:auto}
.sheet.open{transform:translateY(0);pointer-events:auto}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 15px}
.sheet h2{margin:0 0 3px;font-size:19px;font-weight:680;letter-spacing:-.01em}
.sheet .meta{font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:4px;letter-spacing:.04em}
.readout{margin-top:16px}
.readout .big{display:flex;align-items:center;gap:11px}
.readout .big i{width:16px;height:16px;border-radius:5px;background:var(--c);display:block}
.readout .big b{font-size:17px;font-weight:650}
.readout .note{margin-top:14px;font-size:14px;line-height:1.55;color:var(--text);
  background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;white-space:pre-wrap}
.toast{position:fixed;left:max(12px,calc(50% - 203px));right:max(12px,calc(50% - 203px));
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;
  background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
  display:flex;align-items:center;gap:12px;
  transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform .26s cubic-bezier(.32,.72,0,1),opacity .2s}
.toast.open{transform:translateY(0);opacity:1}
.toast .txt{flex:1;font-size:14px;min-width:0}
.toast .txt .tm{font-family:var(--mono);color:var(--dim);font-size:12px;display:block;margin-top:2px}
.toast button{font-size:14px;font-weight:650;color:var(--text);flex:0 0 auto;
  padding:8px 12px;background:var(--line);border-radius:9px;pointer-events:auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="tsw" id="tsw">
      <button data-t="days">Days</button>
      <button data-t="sleep">Sleep</button>
    </div>
    <button class="who" id="gearBtn">DATA<span class="badge" id="gearBadge" hidden></span></button>
  </div>
  <div class="date" id="dateLine"></div>
</header>

<div id="banners"></div>
<main>
  <section class="pane on" id="pane-log"></section>
  <section class="pane" id="pane-history"></section>
  <section class="pane" id="pane-charts"></section>
</main>

<nav>
  <button data-tab="log" class="on"><span class="ind"></span>Log</button>
  <button data-tab="history"><span class="ind"></span>History</button>
  <button data-tab="charts"><span class="ind"></span>Charts</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const APP_VERSION = "1.9.0";
const SCHEMA_VERSION = 2;   /* 2 adds `tracker` to every row; rows without one are days */
const STRIP_DAYS = 7;                /* how much of the week the Log strip shows */
const STRIP_BACK = STRIP_DAYS - 1;   /* ...expressed as days back */

/* the five colours are the one thing both trackers share outright; the words
   under each label come from the tracker (TRACKERS[...].subs) */
const RATINGS = {
  xgreen: {label:"Extra green", hex:"#3FD07A", cls:"gg", extra:true},
  green:  {label:"Green",       hex:"#56A06B", cls:"g"},
  yellow: {label:"Yellow",      hex:"#E3A63F", cls:"y"},
  red:    {label:"Red",         hex:"#C4605A", cls:"r"},
  xred:   {label:"Extra red",   hex:"#F2453D", cls:"rr", extra:true}
};
const RORDER = ["xgreen","green","yellow","red","xred"];
const isGood = r => r === "green" || r === "xgreen";

/* Two trackers share the five colours, the seven-day window, the calendar, the
   charts and the backup file. Everything that differs between them lives here. */
const TRACKERS = {
  days: {
    label:"Days", noun:"day", nounPl:"days", every:"every day", backfill:3,
    prompt:"What drove it",
    placeholder:"Anything worth remembering about this day",
    mix:"Day mix",
    hint:"",
    subs:{xgreen:"One of the best", green:"Good", yellow:"Mixed", red:"Rough",
          xred:"One of the worst"},
    order:["me","others","health"],
    reasons:{
      me:     {label:"Me",        sub:"Something in me — mood, choices, headspace",
               phrase:"me",        hex:"#8A79C6"},
      others: {label:"Others",    sub:"People around me",
               phrase:"others",    hex:"#5B8ED8"},
      health: {label:"My health", sub:"Body, energy, sleep, pain",
               phrase:"my health", hex:"#4E9EA3"}
    }
  },
  sleep: {
    label:"Sleep", noun:"night", nounPl:"nights", every:"every night", backfill:3,
    prompt:"What drove the night",
    placeholder:"Anything worth remembering about this night",
    mix:"Night mix",
    hint:"A night belongs to the day it ended on — log this morning's sleep under today.",
    subs:{xgreen:"One of the best nights", green:"Slept well", yellow:"Mixed",
          red:"Rough night", xred:"One of the worst nights"},
    order:["health","place","alarm","duration","ted"],
    reasons:{
      health:   {label:"My health",       sub:"Body, pain, illness, energy",
                 phrase:"my health",           hex:"#4E9EA3"},
      place:    {label:"New place",       sub:"Not my own bed",
                 phrase:"being somewhere new", hex:"#5B8ED8"},
      alarm:    {label:"Alarm",           sub:"Up at a set time, however it landed",
                 phrase:"the alarm",           hex:"#DE8FA6"},
      duration: {label:"Duration",        sub:"How much of it there was",
                 phrase:"how long it was",     hex:"#7C6FD0"},
      ted:      {label:"Ted shenanigans", sub:"However the night went with Ted",
                 phrase:"Ted shenanigans",     hex:"#B57BC9"}
    }
  }
};
let tracker = "days";
const T = () => TRACKERS[tracker];
/* kept as plain globals so every render below reads the current tracker's set
   without threading it through */
let REASONS = TRACKERS.days.reasons;
let XORDER  = TRACKERS.days.order;
const knownReason = x => Object.prototype.hasOwnProperty.call(REASONS, x);
const reasonPhrase = x => !knownReason(x) ? "a reason no longer on the list"
  : (REASONS[x].phrase || REASONS[x].label.toLowerCase());
function applyTracker(t){
  tracker = t; REASONS = T().reasons; XORDER = T().order;
}

/* ================= storage ================= */
const ERRORS = [];
function logErr(where, e){
  const m = "[" + new Date().toLocaleTimeString() + "] " + where + ": " + (e && e.message ? e.message : e);
  ERRORS.push(m); console.error(m);
}
let memoryOnly = false;
const LS_KEY = "days.entries.v1", LS_META = "days.meta.v1";

function lsGet(k, fb){
  try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); }
  catch(e){ logErr("read " + k, e); return fb; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ logErr("write " + k, e); memoryOnly = true; return false; }
}

let entries = [];                       /* one object per calendar day */
let meta = {lastBackup:null};
let index = new Map();                  /* date -> entry */

let idb = null;
function openIDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("dayTracker", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); };
      r.onsuccess = () => { idb = r.result; res(); };
      r.onerror = () => { logErr("idb open", r.error); res(); };
    } catch(e){ logErr("idb", e); res(); }
  });
}
function idbPut(k, v){
  if(!idb) return;
  try { idb.transaction("kv","readwrite").objectStore("kv").put(v, k); }
  catch(e){ logErr("idb put", e); }
}
function idbGet(k){
  return new Promise(res => {
    if(!idb) return res(null);
    try {
      const r = idb.transaction("kv","readonly").objectStore("kv").get(k);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    } catch(e){ logErr("idb get", e); res(null); }
  });
}

const trackerOf = e => e.tracker || "days";      /* pre-1.9 rows are day rows */
/* every live row of one tracker, newest first */
const live = tk => entries.filter(e => !e.deleted_at && trackerOf(e) === (tk || tracker));
function reindex(){
  index = new Map();
  entries.forEach(e => { if(!e.deleted_at && trackerOf(e) === tracker) index.set(e.date, e); });
}
function save(){
  entries = mergeSets(entries, []);   /* one row per date, newest wins */
  reindex();
  stale.log = stale.history = stale.charts = true;   /* whoever is on screen refreshes itself */
  lsSet(LS_KEY, entries); lsSet(LS_META, meta);
  idbPut("entries", entries); idbPut("meta", meta);
  refreshNotices();          /* the badge follows the data, not just the clock */
}
async function load(){
  await openIDB();
  const a = lsGet(LS_KEY, null);
  const b = await idbGet("entries");
  entries = mergeSets(Array.isArray(a) ? a : [], Array.isArray(b) ? b : []);
  const ma = lsGet(LS_META, null), mb = await idbGet("meta");
  meta = Object.assign({lastBackup:null, tracker:"days"}, mb || {}, ma || {});
  applyTracker(TRACKERS[meta.tracker] ? meta.tracker : "days");
  if(a === null && b === null){
    try { localStorage.setItem("days.test","1"); localStorage.removeItem("days.test"); }
    catch(e){ memoryOnly = true; logErr("storage unavailable", e); }
  }
  reindex();
}
/* merge by tracker + date, newest updated_at wins — lets two backups combine
   cleanly, and keeps a night and a day on the same date apart. Rows from a
   tracker this build does not know are carried through untouched rather than
   dropped, so an older app can never eat newer data. */
function mergeSets(x, y){
  const m = new Map();
  x.concat(y).forEach(e => {
    if(!e || !e.date) return;
    if(!e.tracker) e.tracker = "days";
    const k = e.tracker + "|" + e.date;
    const p = m.get(k);
    if(!p || (e.updated_at || "") > (p.updated_at || "")) m.set(k, e);
  });
  return Array.from(m.values())
    .sort((a,b) => b.date.localeCompare(a.date) || a.tracker.localeCompare(b.tracker));
}

/* ================= date helpers ================= */
const p2 = n => String(n).padStart(2,"0");
function keyOf(d){ return d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate()); }
function dateOf(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
const todayKey = () => keyOf(new Date());
function shiftKey(k, n){ const d = dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function agoOf(k){ return Math.round((dateOf(todayKey()) - dateOf(k)) / 86400000); }
/* Two separate permissions, and a date can hold at most one of them.
   Entering is allowed anywhere in the backfill window while the date is still
   blank. Changing what is already down is allowed only while the date it
   describes is today — once that day is over the entry stands. Together they
   mean a backfilled date locks the moment it is saved. */
const backfillDays = () => T().backfill;
const inWindow  = k => { const a = agoOf(k); return a >= 0 && a <= backfillDays() - 1; };
const canEnter  = k => inWindow(k) && !index.has(k);
const canChange = k => k === todayKey() && index.has(k);
const editable  = k => canEnter(k) || canChange(k);
function fmtDay(k){
  if(k === todayKey()) return "Today";
  if(k === shiftKey(todayKey(), -1)) return "Yesterday";
  return dateOf(k).toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
}
function fmtShort(k){ return dateOf(k).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function daysSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null; }
function buzz(){ try { navigator.vibrate && navigator.vibrate(8); } catch(e){} }
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const zeroed = keys => keys.reduce((o,k) => (o[k] = 0, o), {});
/* "1 night", "6 nights" — the count and its noun, from the tracker on screen */
const nOf = n => n + " " + (n === 1 ? T().noun : T().nounPl);

/* ================= writing ================= */
function putDay(date, rating, reason, note){
  if(!editable(date)) return false;        /* never trust the button alone */
  const now = new Date().toISOString();
  /* tombstones included, so re-logging revives */
  const old = entries.find(e => e.date === date && trackerOf(e) === tracker);
  if(old){
    old.rating = rating; old.reason = reason; old.note = note || "";
    old.updated_at = now; old.deleted_at = null;
  } else {
    entries.push({tracker:tracker, date:date, rating:rating, reason:reason, note:note || "",
      created_at:now, updated_at:now, deleted_at:null, schema_version:SCHEMA_VERSION});
  }
  save();
  return true;
}
function clearDay(date){
  if(!canChange(date)) return false;       /* deleting a locked day is a change */
  const old = index.get(date);
  if(!old) return false;
  old.deleted_at = new Date().toISOString();
  old.updated_at = old.deleted_at;
  save();
  return true;
}

/* ================= chrome ================= */
/* Each tab keeps its own pane in the DOM. Switching toggles visibility instead of
   tearing the view down, so nothing reflows and scroll position survives. */
let tab = "log";
const PANE = {log:      document.getElementById("pane-log"),
              history:  document.getElementById("pane-history"),
              charts:   document.getElementById("pane-charts")};
const stale     = {log:false, history:true, charts:true};
const scrollMem = {log:0, history:0, charts:0};
const SCROLLER = document.querySelector("main");
function refreshCurrent(){ RENDER[tab](); stale[tab] = false; }

function renderHeader(){
  document.getElementById("dateLine").textContent =
    new Date().toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"}).toUpperCase();
  document.querySelectorAll("#tsw button")
    .forEach(b => b.classList.toggle("on", b.dataset.t === tracker));
}
function renderBanners(){
  const b = [];
  if(memoryOnly)
    b.push('<div class="banner"><span><b>Storage is blocked.</b> Nothing you enter will survive closing the app. Open it from the Home Screen icon, not a private tab.</span></div>');
  document.getElementById("banners").innerHTML = b.join("");
  refreshNotices();
}

/* ---- notices: quiet until Sunday, then a count on the DATA button ---- */
let updateReady = false;
function lastSunday(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());        /* Sunday 00:00 of this week */
  return d;
}
function backupDue(){
  if(!entries.filter(e => !e.deleted_at).length) return false;
  if(!meta.lastBackup) return true;
  return new Date(meta.lastBackup) < lastSunday();
}
function notices(){
  const out = [];
  if(backupDue()) out.push({
    title: "Weekly backup",
    body: meta.lastBackup
      ? "Last one was " + daysSince(meta.lastBackup) + " days ago. Export this week's."
      : "You have not backed up yet. Everything is on this device only.",
    label: "Back up", fn: "exportJSON()"
  });
  if(updateReady) out.push({
    title: "New version ready",
    body: "Reload to start using it. Your entries are untouched.",
    label: "Reload", fn: "forceUpdate()"
  });
  return out;
}
function refreshNotices(){
  const n = notices().length;
  const el = document.getElementById("gearBadge");
  if(el){ el.textContent = n; el.hidden = !n; }
  try {
    if(navigator.setAppBadge){ n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); }
  } catch(e){}
}

/* ================= LOG TAB ================= */
let logDate = todayKey();
let logEditing = false;
let draft = {rating:null, reason:null, note:""};

function loadDraft(){
  const e = index.get(logDate);
  draft = e ? {rating:e.rating, reason:e.reason, note:e.note || ""} : {rating:null, reason:null, note:""};
}
function ratesHTML(sel){
  return '<div class="rates">' + RORDER.map(r =>
    '<button class="rate' + (sel === r ? " on" : "") + (RATINGS[r].extra ? " extra" : "") +
      '" data-r="' + r + '" style="--c:' + RATINGS[r].hex + '">' +
      '<span class="swatch"></span>' +
      '<span class="t"><span class="lbl">' + RATINGS[r].label + '</span>' +
      '<span class="sub">' + T().subs[r] + '</span></span></button>').join("") + '</div>';
}
function chipsHTML(sel, enabled){
  return '<div class="chips' + (enabled ? "" : " off") + '">' +
    XORDER.map(x =>
      '<button class="chip' + (sel === x ? " on" : "") + '" data-x="' + x + '"' +
        ' style="--c:' + REASONS[x].hex + '">' +
        '<span class="dot"></span><span class="t"><b>' + REASONS[x].label + '</b>' +
        '<i>' + REASONS[x].sub + '</i></span></button>').join("") + '</div>';
}

function readoutHTML(e){
  return '<div class="readout"><div class="big" style="--c:' + RATINGS[e.rating].hex + '">' +
    '<i></i><b>' + RATINGS[e.rating].label + '</b>' +
    '<span style="color:var(--dim);font-size:14px">because of ' + reasonPhrase(e.reason) +
    '</span></div>' +
    (e.note ? '<div class="note">' + esc(e.note) + '</div>'
            : '<div class="hint">No comment on this ' + T().noun + '.</div>') + '</div>';
}

function renderLog(){
  const view = PANE.log;
  let sel = '<div class="dsel">';
  for(let i = STRIP_BACK; i >= 0; i--){
    const k = shiftKey(todayKey(), -i), e = index.get(k), d = dateOf(k);
    sel += '<button data-d="' + k + '" class="' + (e ? "lit" : "") + (k === logDate ? " on" : "") + '"' +
      (e ? ' style="--c:' + RATINGS[e.rating].hex + '"' : '') + '>' +
      '<span class="wd">' + "SMTWTFS"[d.getDay()] + '</span>' +
      '<span class="dn">' + d.getDate() + '</span></button>';
  }
  sel += '</div>';

  const existing = index.get(logDate);
  const mayChange = canChange(logDate);

  /* Anything already saved reads back as a summary. On the day itself changing
     it takes a deliberate tap, so a stray touch cannot rewrite it; after that
     day there is no way back in at all. */
  if(existing && !(mayChange && logEditing)){
    view.innerHTML = sel +
      '<div class="picked">' + fmtDay(logDate) +
        '<span>' + (mayChange ? "LOGGED" : "LOGGED &middot; LOCKED") + '</span></div>' +
      readoutHTML(existing) +
      (mayChange
        ? '<button class="btn" id="chg">Change this ' + T().noun + '</button>'
        : '<div class="hint">Locked. A ' + T().noun + ' can only be changed on the ' +
            'day it belongs to — after that it stands.</div>');
    view.querySelectorAll(".dsel button").forEach(b => b.onclick = () => pickLogDate(b.dataset.d));
    const chg = view.querySelector("#chg");
    if(chg) chg.onclick = () => { logEditing = true; renderLog(); };
    return;
  }

  /* Blank and out of reach: too far back to fill in now. */
  if(!existing && !canEnter(logDate)){
    view.innerHTML = sel +
      '<div class="picked">' + fmtDay(logDate) + '<span>CLOSED</span></div>' +
      '<div class="hint" style="margin-top:16px">Nothing was logged, and this ' + T().noun +
        ' is closed. You can only fill in today and the ' + (backfillDays() - 1) +
        ' ' + (backfillDays() === 2 ? T().noun : T().nounPl) + ' before it.</div>';
    view.querySelectorAll(".dsel button").forEach(b => b.onclick = () => pickLogDate(b.dataset.d));
    return;
  }

  const tiles = ratesHTML(draft.rating);
  const chips = chipsHTML(draft.reason, !!draft.rating);
  const ready = draft.rating && draft.reason;
  view.innerHTML = sel +
    '<div class="picked">' + fmtDay(logDate) +
      '<span>' + (existing ? "ALREADY LOGGED · EDITING" : "NOT LOGGED YET") + '</span></div>' +
    tiles +
    '<label style="margin-top:22px">' + T().prompt + '</label>' + chips +
    '<label for="nt">Comment (optional)</label>' +
    '<textarea id="nt" placeholder="' + T().placeholder + '">' + esc(draft.note) + '</textarea>' +
    '<button class="btn primary" id="sv"' + (ready ? "" : " disabled") + '>' +
      (existing ? "Update this " + T().noun : "Save this " + T().noun) + '</button>' +
    '<button class="btn danger" id="rm"' + (existing ? '' : ' hidden') + '>Remove this entry</button>' +
    (existing ? '<button class="btn" id="cxl">Cancel</button>' : '') +
    '<div class="hint">You can fill in today and the ' + (backfillDays() - 1) + ' ' +
      (backfillDays() === 2 ? T().noun : T().nounPl) + ' before it. Once saved, a ' + T().noun +
      ' can only be changed on the day it belongs to — after that it stands, ' +
      'so the history stays honest.' +
      (T().hint ? '<br>' + T().hint : '') + '</div>';

  view.querySelectorAll(".dsel button").forEach(b => b.onclick = () => pickLogDate(b.dataset.d));
  /* Selection only flips classes — the comment box is never rebuilt, so the
     keyboard and caret survive tapping a colour or a reason mid-sentence. */
  view.querySelectorAll(".rate").forEach(b => b.onclick = () => {
    buzz(); draft.rating = (draft.rating === b.dataset.r) ? null : b.dataset.r; syncLog();
  });
  view.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    buzz(); draft.reason = (draft.reason === b.dataset.x) ? null : b.dataset.x; syncLog();
  });
  view.querySelector("#nt").addEventListener("input", ev => { draft.note = ev.target.value; });
  view.querySelector("#sv").onclick = () => {
    if(!draft.rating || !draft.reason) return;
    /* backfilling is a one-shot: the day it describes has already passed, so it
       is locked the instant it is written */
    if(logDate !== todayKey() &&
       !confirm(fmtDay(logDate) + " is already past, so this locks as soon as you save it " +
                "and cannot be changed afterwards.\n\nSave it?")) return;
    if(!putDay(logDate, draft.rating, draft.reason, view.querySelector("#nt").value)) return;
    buzz(); renderHeader(); renderBanners();
    logEditing = false; renderLog(); stale.log = false;
    toast(fmtDay(logDate) + " saved",
      T().label + " · " + RATINGS[draft.rating].label + " · " + REASONS[draft.reason].label);
  };
  view.querySelector("#rm").onclick = () => {
    if(!confirm("Remove the entry for " + fmtDay(logDate) + "?")) return;
    clearDay(logDate); loadDraft(); renderHeader(); renderBanners();
    logEditing = false; renderLog(); stale.log = false;
    toast("Entry removed", fmtShort(logDate));
  };
  const cxl = view.querySelector("#cxl");
  if(cxl) cxl.onclick = () => { logEditing = false; loadDraft(); renderLog(); };
}

function pickLogDate(k){
  logDate = k; logEditing = false; loadDraft(); renderLog();
}


/* in-place update of everything on the Log pane that depends on state */
function syncLog(){
  const view = PANE.log, existing = index.get(logDate);
  if(!view.querySelector("#sv")) return;          /* summary mode — nothing to sync */
  view.querySelectorAll(".rate").forEach(b => b.classList.toggle("on", b.dataset.r === draft.rating));
  view.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.x === draft.reason));
  view.querySelector(".chips").classList.toggle("off", !draft.rating);
  const sv = view.querySelector("#sv");
  sv.disabled = !(draft.rating && draft.reason);
  sv.textContent = (existing ? "Update this " : "Save this ") + T().noun;
  view.querySelector("#rm").hidden = !existing;
  view.querySelector(".picked span").textContent =
    existing ? "ALREADY LOGGED · EDITING" : "NOT LOGGED YET";
  view.querySelectorAll(".dsel button").forEach(b => {
    const e = index.get(b.dataset.d);
    b.classList.toggle("lit", !!e);
    if(e) b.style.setProperty("--c", RATINGS[e.rating].hex); else b.style.removeProperty("--c");
  });
}

/* ================= HISTORY TAB ================= */
let calY = new Date().getFullYear(), calM = new Date().getMonth();

function renderHistory(){
  const view = PANE.history;
  const first = new Date(calY, calM, 1);
  const pad = first.getDay();
  const dim = new Date(calY, calM+1, 0).getDate();
  const now = new Date(), atNow = (calY === now.getFullYear() && calM === now.getMonth());

  let cells = "";
  for(let i = 0; i < pad; i++) cells += '<div class="pad"></div>';
  const counts = zeroed(RORDER); let logged = 0, elapsed = 0;
  for(let d = 1; d <= dim; d++){
    const k = keyOf(new Date(calY, calM, d));
    const e = index.get(k), future = agoOf(k) < 0;
    if(!future) elapsed++;
    if(e){ counts[e.rating]++; logged++; }
    cells += '<button class="cell ' + (e ? RATINGS[e.rating].cls : "") +
      (future ? " future" : "") + (k === todayKey() ? " today" : "") +
      (!editable(k) && !future ? " locked" : "") + '" data-d="' + k + '"' +
      (future ? " disabled" : "") + '>' + d +
      (e && e.note ? '<span class="nt"></span>' : '') + '</button>';
  }

  view.innerHTML =
    '<div class="mhead">' +
      '<div class="m">' + first.toLocaleDateString([], {month:"long", year:"numeric"}) + '</div>' +
      '<div class="mnav">' +
        '<button class="tdy" id="td"' + (atNow ? " disabled" : "") + '>Today</button>' +
        '<button class="arw" id="pm">&lsaquo;</button>' +
        '<button class="arw" id="nm"' + (atNow ? " disabled" : "") + '>&rsaquo;</button>' +
      '</div>' +
    '</div>' +
    '<div class="wdays"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>' +
    '<div class="cal">' + cells + '</div>' +
    '<div class="legend">' +
      RORDER.map(r => '<div style="color:' + RATINGS[r].hex + '"><i class="' +
        (RATINGS[r].extra ? "halo" : "") + '" style="border-radius:50%;background:' + RATINGS[r].hex +
        '"></i><span style="color:var(--dim)">' + RATINGS[r].label + '</span></div>').join("") +
      '<div><i style="border-radius:50%;background:var(--surface);border:1px solid var(--line)"></i>Not logged</div>' +
    '</div>' +
    '<div class="sec"><div class="sechead"><div class="eyebrow">This month</div>' +
      '<div class="eyebrow">' + logged + ' of ' + nOf(elapsed) + ' logged</div></div>' +
      (logged ? splitBar(counts, logged) + mixRows(counts, logged)
              : '<div class="empty">No ' + T().nounPl + ' logged this month yet.</div>') +
    '</div>' +
    '<div class="hint" style="margin-top:18px">Tap a day to see what you put down. ' +
      'Changes are made on the Log tab.</div>';

  document.getElementById("pm").onclick = () => {
    calM--; if(calM < 0){ calM = 11; calY--; } renderHistory();
  };
  document.getElementById("nm").onclick = () => {
    if(atNow) return;
    calM++; if(calM > 11){ calM = 0; calY++; } renderHistory();
  };
  document.getElementById("td").onclick = () => {
    if(atNow) return;
    const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); renderHistory();
  };
  view.querySelectorAll(".cal .cell").forEach(b => {
    if(!b.disabled) b.onclick = () => daySheet(b.dataset.d);
  });
}

/* Read-only. Every edit happens on the Log tab, so a tap in the calendar can
   never change what a day says. */
function daySheet(k){
  const e = index.get(k);
  let body = '<h2>' + fmtDay(k) + '</h2><div class="meta">' +
    (agoOf(k) <= 1
      ? dateOf(k).toLocaleDateString([], {month:"long", day:"numeric", year:"numeric"}).toUpperCase()
      : agoOf(k) + " DAYS AGO") + '</div>';

  body += e
    ? readoutHTML(e)
    : '<div class="readout"><div style="color:var(--dim);font-size:14px">Nothing logged on the ' +
        T().label.toLowerCase() + ' tracker for this day.</div></div>';

  body += '<div class="hint">' + (
      canChange(k) ? 'To change this, open it on the Log tab.'
    : canEnter(k)  ? 'Not logged yet — you can still fill it in on the Log tab.'
    : e            ? 'Locked — only changeable on the day it belongs to.'
    :                'Closed — outside the last ' + backfillDays() + ' ' + T().nounPl + '.') + '</div>' +
    '<button class="btn" onclick="closeSheet()">Close</button>';

  openSheet(body);
}

/* ================= CHARTS TAB ================= */
const RANGES = [{k:"30", label:"30 days", days:30}, {k:"90", label:"90 days", days:90},
                {k:"365", label:"1 year", days:365}, {k:"all", label:"All", days:null}];
let range = "30";

function inRange(){
  const r = RANGES.find(x => x.k === range);
  const all = live();
  if(!r.days) return all;
  const cut = shiftKey(todayKey(), -(r.days - 1));
  return all.filter(e => e.date >= cut);
}
function splitBar(counts, total){
  return '<div class="bigsplit">' + RORDER.map(r =>
    '<i style="width:' + (total ? counts[r] / total * 100 : 0) + '%;background:' + RATINGS[r].hex + '"></i>'
  ).join("") + '</div>';
}
function mixRows(counts, total){
  return '<div class="mix">' + RORDER.map(r =>
    '<div class="mixrow' + (RATINGS[r].extra ? " extra" : "") + '" style="--c:' + RATINGS[r].hex + '">' +
      '<i class="sw"></i>' +
      '<span class="ml">' + RATINGS[r].label + '</span>' +
      '<span class="mb"><i style="width:' + (total ? counts[r] / total * 100 : 0) + '%"></i></span>' +
      '<span class="mv">' + pct(counts[r], total) + '%</span>' +
      '<span class="mn">' + counts[r] + '</span></div>'
  ).join("") + '</div>';
}
function trackRow(title, right, parts, keyDefs, total){
  return '<div class="row"><div class="rl"><b>' + title + '</b><span>' + right + '</span></div>' +
    '<div class="track">' + keyDefs.map(d =>
      '<i style="width:' + (total ? parts[d.k] / total * 100 : 0) + '%;background:' + d.hex + '"></i>'
    ).join("") + '</div></div>';
}
function reasonKey(){
  return '<div class="rkey">' + XORDER.map(x =>
    '<div><i style="background:' + REASONS[x].hex + '"></i>' + REASONS[x].label + '</div>').join("") + '</div>';
}
function ratingKey(){
  return '<div class="rkey">' + RORDER.map(r =>
    '<div><i style="background:' + RATINGS[r].hex + '"></i>' + RATINGS[r].label + '</div>').join("") + '</div>';
}

function renderCharts(){
  const view = PANE.charts;
  /* a row filed under a reason since removed still shows on Log and History —
     it just cannot be counted into a breakdown that has no bucket for it */
  const rows = inRange().filter(e => knownReason(e.reason));
  const total = rows.length;
  const bar = '<div class="rangebar">' + RANGES.map(r =>
    '<button data-k="' + r.k + '"' + (range === r.k ? ' class="on"' : '') + '>' + r.label + '</button>').join("") + '</div>';

  if(!total){
    view.innerHTML = bar + '<div class="empty">No ' + T().nounPl + ' logged in this range yet.<br>Log a few and the picture shows up here.</div>';
    view.querySelectorAll(".rangebar button").forEach(b => b.onclick = () => { range = b.dataset.k; renderCharts(); });
    return;
  }

  const counts = zeroed(RORDER), rCounts = zeroed(XORDER);
  const byRating = {}; RORDER.forEach(r => byRating[r] = zeroed(XORDER));
  const byReason = {}; XORDER.forEach(x => byReason[x] = zeroed(RORDER));
  const wd = [0,1,2,3,4,5,6].map(() => Object.assign(zeroed(RORDER), {n:0}));
  rows.forEach(e => {
    counts[e.rating]++; rCounts[e.reason]++;
    byRating[e.rating][e.reason]++; byReason[e.reason][e.rating]++;
    const w = wd[dateOf(e.date).getDay()];
    w[e.rating]++; w.n++;
  });

  const rdefs = XORDER.map(x => ({k:x, hex:REASONS[x].hex}));
  const cdefs = RORDER.map(r => ({k:r, hex:RATINGS[r].hex}));

  /* streaks over the whole log, not just the range */
  const all = live().slice().sort((a,b) => a.date.localeCompare(b.date));
  let best = 0, run = 0, prev = null;
  all.forEach(e => {
    run = (isGood(e.rating) && prev && e.date === shiftKey(prev, 1)) ? run + 1
        : (isGood(e.rating) ? 1 : 0);
    if(run > best) best = run;
    prev = e.date;
  });
  let cur = 0, walk = index.has(todayKey()) ? todayKey() : shiftKey(todayKey(), -1);
  while(true){
    const e = index.get(walk);
    if(!e || !isGood(e.rating)) break;
    cur++; walk = shiftKey(walk, -1);
  }
  const goodDays = RORDER.filter(isGood).reduce((n,r) => n + counts[r], 0);
  const badDays  = counts.red + counts.xred;
  const wdMax = Math.max(1, ...wd.map(w => w.n));
  const topReason = XORDER.slice().sort((a,b) => rCounts[b] - rCounts[a])[0];
  const topFor = r => XORDER.slice().sort((a,b) => byRating[r][b] - byRating[r][a])[0];
  const greenTop = topFor("green"), redTop = topFor("red");

  view.innerHTML = bar +
    '<div class="sec"><div class="sechead"><div class="eyebrow">' + T().mix + '</div>' +
      '<div class="eyebrow">' + total + ' logged</div></div>' +
      splitBar(counts, total) + mixRows(counts, total) + '</div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">Behind each colour</div></div>' +
      '<div class="card">' +
      RORDER.map(r => counts[r]
        ? trackRow(RATINGS[r].label + " " + T().nounPl, counts[r] + " · mostly " +
            reasonPhrase(XORDER.slice().sort((a,b) => byRating[r][b] - byRating[r][a])[0]),
            byRating[r], rdefs, counts[r])
        : trackRow(RATINGS[r].label + " " + T().nounPl, "none", byRating[r], rdefs, 0)).join("") +
      reasonKey() + '</div></div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">Each reason&rsquo;s record</div></div>' +
      '<div class="card">' +
      XORDER.map(x => trackRow(REASONS[x].label,
        rCounts[x] ? nOf(rCounts[x]) + " · " + pct(byReason[x].green, rCounts[x]) + "% green" : "none",
        byReason[x], cdefs, rCounts[x])).join("") +
      ratingKey() + '</div></div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">By day of week</div></div>' +
      '<div class="card"><div class="wbars">' +
      wd.map((w, i) => '<div class="wbar"><div class="stack" style="height:' + (w.n / wdMax * 100) + '%">' +
        RORDER.map(r => '<i style="height:' + (w.n ? w[r] / w.n * 100 : 0) + '%;background:' + RATINGS[r].hex + '"></i>').join("") +
        '</div><div class="wl">' + "SMTWTFS"[i] + '</div></div>').join("") +
      '</div><p style="margin-top:12px">Bar height is how many of that weekday you logged; the colours are how they went.</p></div></div>' +

    '<div class="sec"><div class="sechead"><div class="eyebrow">Numbers</div></div>' +
      '<div class="stats">' +
      '<div class="stat"><div class="v" style="color:var(--green)">' + cur + '</div>' +
        '<div class="k">Good streak now</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--green)">' + best + '</div>' +
        '<div class="k">Longest good streak</div></div>' +
      '</div></div>' +

    '<div class="sec"><div class="card"><h3>The short version</h3><p>' +
      'Over ' + (RANGES.find(x => x.k === range).days ? "the last " + RANGES.find(x => x.k === range).label : "everything logged") +
      ', <b>' + pct(goodDays, total) + '%</b> of your ' + T().nounPl + ' came out green or better' +
      (counts.xgreen ? ', including ' + counts.xgreen + ' you called extra green' : '') + '. ' +
      REASONS[topReason].label + ' is the reason you point at most often (' +
      pct(rCounts[topReason], total) + '% of ' + T().nounPl + '). ' +
      (counts.green ? "Green " + T().nounPl + " are usually down to " + reasonPhrase(greenTop) + ". " : "") +
      (counts.red ? "Red " + T().nounPl + " are usually down to " + reasonPhrase(redTop) + ". " : "") +
      (counts.xred ? counts.xred + " " + T().noun + (counts.xred === 1 ? " was" : "s were") + " extra red." :
        (badDays ? "" : "Nothing landed in the red.")) +
      '</p></div></div>';

  view.querySelectorAll(".rangebar button").forEach(b => b.onclick = () => { range = b.dataset.k; renderCharts(); });
}

/* ================= nav ================= */
const RENDER = {log:renderLog, history:renderHistory, charts:renderCharts};
function go(t){
  const same = (t === tab);
  if(!same) scrollMem[tab] = SCROLLER.scrollTop;
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  for(const k in PANE) PANE[k].classList.toggle("on", k === t);
  if(stale[t]){ RENDER[t](); stale[t] = false; }
  if(!same) SCROLLER.scrollTop = scrollMem[t] || 0;
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

/* Switching tracker keeps the tab you are on but rebuilds all three panes: the
   index, the draft and every chart are scoped to one tracker at a time. */
function setTracker(t){
  if(t === tracker || !TRACKERS[t]) return;
  scrollMem[tab] = SCROLLER.scrollTop;
  applyTracker(t);
  meta.tracker = t;
  lsSet(LS_META, meta); idbPut("meta", meta);
  reindex();
  const back = agoOf(logDate);
  if(back < 0 || back > STRIP_BACK) logDate = todayKey();
  logEditing = false; loadDraft();
  stale.log = stale.history = stale.charts = true;
  scrollMem.log = scrollMem.history = scrollMem.charts = 0;
  renderHeader(); refreshCurrent();
  SCROLLER.scrollTop = 0;
  buzz();
}
document.querySelectorAll("#tsw button")
  .forEach(b => b.addEventListener("click", () => setTracker(b.dataset.t)));

/* ================= toast + sheet ================= */
let toastT = null;
function toast(msg, sub, actionLabel, fn){
  const el = document.getElementById("toast");
  el.innerHTML = '<span class="txt">' + esc(msg) + '<span class="tm">' + esc(sub) + '</span></span>' +
    (actionLabel ? '<button id="tact">' + esc(actionLabel) + '</button>' : "");
  if(actionLabel) document.getElementById("tact").onclick = () => { hideToast(); fn(); };
  el.classList.add("open");
  clearTimeout(toastT); toastT = setTimeout(hideToast, 4200);
}
function hideToast(){ document.getElementById("toast").classList.remove("open"); }

const scrim = document.getElementById("scrim"), sheet = document.getElementById("sheet");
scrim.addEventListener("click", closeSheet);
function openSheet(html){
  sheet.innerHTML = '<div class="handle"></div>' + html;
  scrim.classList.add("open"); sheet.classList.add("open");
}
function closeSheet(){
  scrim.classList.remove("open"); sheet.classList.remove("open");
  setTimeout(() => { if(!sheet.classList.contains("open")) sheet.innerHTML = ""; }, 260);
}

/* ================= data sheet ================= */
function dataSheet(){
  const since = daysSince(meta.lastBackup);
  const ns = notices();
  openSheet(
    '<h2>Data</h2><div class="meta">EVERYTHING LIVES ON THIS DEVICE</div>' +
    ns.map(n => '<div class="notice"><span class="ntx"><b>' + n.title + '</b>' +
      '<span>' + n.body + '</span></span>' +
      '<button onclick="' + n.fn + '">' + n.label + '</button></div>').join("") +
    (ns.length ? '' : '<div class="hint" style="margin-top:12px">Nothing needs your attention. ' +
      'A backup reminder appears here every Sunday.</div>') +
    '<div class="card" style="margin-top:16px">' +
      Object.keys(TRACKERS).map(t => '<div class="kv"><span>' + TRACKERS[t].label +
        ' on record</span><span>' + live(t).length + '</span></div>').join("") +
      '<div class="kv"><span>Last backup</span><span>' +
        (meta.lastBackup ? (since === 0 ? "today" : since + "d ago") : "never") + '</span></div>' +
      '<div class="kv"><span>Version</span><span>' + APP_VERSION + '</span></div>' +
    '</div>' +
    '<button class="btn primary" onclick="exportJSON()">Export backup file</button>' +
    '<div class="hint">Opens the share sheet. If Google Drive is not offered there, ' +
      'use <b>Save to Files</b> → Google Drive.</div>' +
    '<button class="btn" onclick="copyBackup()">Copy backup as text</button>' +
    '<div class="hint">Works anywhere. Paste it into a Drive document, a note, or an ' +
      'email to yourself.</div>' +
    '<button class="btn" onclick="exportCSV()">Export spreadsheet (CSV)</button>' +
    '<label for="imp">Restore from a file</label>' +
    '<input type="file" id="imp" accept="application/json,text/plain,.json,.txt">' +
    '<label for="pastebox">Or paste a backup</label>' +
    '<textarea id="pastebox" placeholder="Paste copied backup text here"></textarea>' +
    '<button class="btn" onclick="restorePasted()">Restore from pasted text</button>' +
    '<div class="hint">One backup holds both trackers. Either way entries merge by ' +
      'tracker and date and the newer version wins — restoring never loses what you ' +
      'have already logged.</div>' +
    '<button class="btn" onclick="forceUpdate()">Check for update</button>' +
    (ERRORS.length ? '<label>Errors</label><div class="log">' + esc(ERRORS.join("\n")) + '</div>' : '') +
    '<button class="btn" onclick="closeSheet()">Close</button>');
  document.getElementById("imp").addEventListener("change", importJSON);
}
document.getElementById("gearBtn").addEventListener("click", dataSheet);

/* ================= export / import ================= */
function download(name, text, mime){
  try {
    const blob = new Blob([text], {type: mime});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch(err){ logErr("download", err); alert("Export failed. Check the Errors list."); }
}
const stamp = () => new Date().toISOString().slice(0,10);

/* Hand the file to the OS share sheet when there is one — that is the route to
   Google Drive, Files, iCloud, mail. Falls back to a plain download elsewhere. */
function sendFile(name, text, mime){
  try {
    const file = new File([text], name, {type: mime});
    /* files only — adding a title makes iOS treat this as a text share and offer
       apps that take text rather than apps that take documents */
    if(navigator.canShare && navigator.canShare({files:[file]}))
      return navigator.share({files:[file]}).then(() => "shared");
  } catch(e){ logErr("share", e); }
  download(name, text, mime);
  return Promise.resolve("downloaded");
}
function backupText(){
  return JSON.stringify({app:"days-tracker", schema_version:SCHEMA_VERSION, app_version:APP_VERSION,
    exported_at:new Date().toISOString(), entries:entries}, null, 2);
}
function markBackedUp(){
  meta.lastBackup = new Date().toISOString(); save(); refreshNotices();
  if(document.getElementById("imp")) dataSheet();
}
/* Clipboard route: works even when the share sheet offers nothing useful.
   Paste it into a Drive doc, a note, an email — anywhere that holds text. */
function copyBackup(){
  const text = backupText();
  const done = () => { markBackedUp(); toast("Backup copied", "Paste it somewhere safe"); };
  const manual = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); done(); }
    catch(e){ logErr("copy", e); alert("Could not copy automatically."); }
    ta.remove();
  };
  /* the async API needs a focused document; fall back quietly when it refuses */
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done).catch(manual);
  else manual();
}
function exportJSON(){
  const name = "days-backup-" + stamp() + ".json";
  sendFile(name, backupText(), "application/json").then(how => {
    markBackedUp();
    toast("Backup made", how === "shared" ? "Save it to Google Drive" : name);
  }).catch(err => {
    if(err && err.name === "AbortError") return;       /* user closed the share sheet */
    logErr("export", err); alert("Export failed. Check the Errors list.");
  });
}
function exportCSV(){
  const head = ["tracker","date","weekday","rating","reason","comment","created_at","updated_at"];
  const q = s => '"' + String(s == null ? "" : s).replace(/"/g,'""') + '"';
  const rows = entries.filter(e => !e.deleted_at).slice()
    .sort((a,b) => a.date.localeCompare(b.date) || trackerOf(a).localeCompare(trackerOf(b))).map(e => [
    trackerOf(e), e.date, dateOf(e.date).toLocaleDateString([], {weekday:"long"}), e.rating, e.reason, e.note,
    e.created_at, e.updated_at
  ].map(q).join(","));
  sendFile("days-" + stamp() + ".csv", head.join(",") + "\n" + rows.join("\n"), "text/csv")
    .catch(err => { if(!err || err.name !== "AbortError") logErr("export csv", err); });
}
function ingest(text, what){
  try {
    const d = JSON.parse(text);
    const incoming = Array.isArray(d) ? d : d.entries;
    if(!Array.isArray(incoming)) throw new Error("no entries in it");
    const before = entries.length;
    entries = mergeSets(entries, incoming);
    save(); loadDraft(); renderHeader(); renderBanners();
    alert("Restored. " + (entries.length - before) + " new entries added, " + entries.length +
      " total — " + Object.keys(TRACKERS).map(t => live(t).length + " " + TRACKERS[t].nounPl).join(", ") + ".");
    closeSheet(); refreshCurrent();
  } catch(e){ logErr("import", e); alert("Could not read that " + what + ": " + e.message); }
}
function importJSON(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { ingest(r.result, "file"); ev.target.value = ""; };
  r.readAsText(f);
}
function restorePasted(){
  const ta = document.getElementById("pastebox");
  const txt = (ta && ta.value || "").trim();
  if(!txt) return alert("Paste a backup into the box first.");
  ingest(txt, "text");
}
function forceUpdate(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistrations().then(rs => {
      Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
    }).catch(() => location.reload(true));
  } else location.reload(true);
}

/* ================= boot ================= */
window.addEventListener("error", ev => logErr("uncaught", ev.error || ev.message));
document.addEventListener("visibilitychange", () => {
  /* midnight rollover while the app sat open */
  if(document.hidden) return;
  if(agoOf(logDate) < 0){ logDate = todayKey(); loadDraft(); stale.log = true; }
  if(stale[tab]) refreshCurrent();
  refreshNotices();
  if("serviceWorker" in navigator)
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
});
load().then(() => {
  loadDraft();
  renderHeader(); renderBanners();
  renderLog(); stale.log = false;
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(reg => {
      if(reg.waiting){ updateReady = true; refreshNotices(); }
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", () => {
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            updateReady = true; refreshNotices();
          }
        });
      });
    }).catch(e => logErr("sw", e));
  }
});
</script>
